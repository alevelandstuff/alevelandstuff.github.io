/* Motion supports orientation and feedback without delaying answers. */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-soft:cubic-bezier(.2,.7,.3,1)}
html{scroll-behavior:smooth}
.main .content>.intro,.session>.panel{animation:arrive .38s var(--ease-out) backwards}
.content>.hero{animation:arrive .48s var(--ease-out) backwards}
.stat{animation:arrive .45s var(--ease-out) backwards}
.stat:nth-child(2){animation-delay:45ms}.stat:nth-child(3){animation-delay:90ms}
.mode-card,.module-card{animation:arrive .48s var(--ease-out) backwards;transition:transform .28s var(--ease-out),box-shadow .28s ease,border-color .22s ease,background .22s ease}
.mode-card:nth-child(2),.module-card:nth-child(2){animation-delay:55ms}
.mode-card:nth-child(3),.module-card:nth-child(3){animation-delay:110ms}
.module-card:nth-child(4){animation-delay:145ms}.module-card:nth-child(5){animation-delay:180ms}.module-card:nth-child(6){animation-delay:215ms}
.btn,.nav button,.back{transition:transform .2s var(--ease-out),background-color .22s ease,color .22s ease,box-shadow .22s ease,opacity .2s ease}
.btn:active:not(:disabled),.mode-card:active,.module-card:active{transform:scale(.98)}
.btn:focus-visible,.choice:focus-visible,.mode-card:focus-visible,.module-card:focus-visible{outline:3px solid #94b97b;outline-offset:4px}
.nav button.active{box-shadow:inset 3px 0 0 #8db66b}
.nav button:hover{background-color:#f1f5ed}
.topic-row{transition:background-color .25s ease,border-color .25s ease,box-shadow .25s ease,transform .25s var(--ease-out)}
.topic-row:has(input:checked){box-shadow:0 0 0 1px #8fae7940}
.topic-row input{transition:transform .2s var(--ease-out)}
.topic-row input:checked{animation:check-in .25s var(--ease-out)}
.selection-bar{transition:box-shadow .3s ease;animation:bar-arrive .35s var(--ease-out) backwards}
.selection-bar strong,.selection-bar small{animation:fade-in .2s ease backwards}
.choice{transition:background-color .24s ease,border-color .24s ease,box-shadow .24s ease,transform .24s var(--ease-out),color .24s ease;animation:choice-arrive .3s var(--ease-out) backwards}
.choice:nth-child(2){animation-delay:30ms}.choice:nth-child(3){animation-delay:60ms}.choice:nth-child(4){animation-delay:90ms}
.choice:active:not(:disabled){transform:scale(.99)}
.choice.right{box-shadow:0 0 0 1px #8bb07435}
.choice.wrong .letter{animation:gentle-shake .3s ease backwards}
.feedback{animation:feedback-arrive .32s var(--ease-out) backwards}
.scheme{animation:feedback-arrive .4s var(--ease-out) backwards}
.track>i{transition:width .4s var(--ease-soft);transform-origin:left}
.timer{transition:color .3s ease}
.timer.low{animation:time-pulse 1.4s ease-in-out infinite}
.hero-art svg{animation:orbit-float 9s ease-in-out infinite;transform-origin:center}
.hero-art circle[fill]{animation:electron-glow 4s ease-in-out infinite alternate}
.hero-art circle[fill]:nth-last-of-type(2){animation-delay:-1.3s}
.toast{animation:toast-arrive .3s var(--ease-out) backwards}
textarea{transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease}
textarea:focus{border-color:#8eae7b;box-shadow:0 0 0 3px #8eae7b20;background:#fff}
.learning-cue{margin:13px 0 18px;padding:13px 16px;border-left:3px solid #9bbb7a;border-radius:0 8px 8px 0;background:#f3f7ed;font-size:12px;line-height:1.8;color:#476044}
.learning-cue strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.1px;margin-bottom:4px;color:#678052}
.question-actions{min-height:44px}

/* Typed recall uses the same feedback and reduced-motion system as MCQ. */
.answer-type{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--green);margin-bottom:12px}

@media(max-width:480px){.typed-controls{align-items:stretch;flex-direction:column;gap:12px}.typed-controls .hint{max-width:100%}.typed-controls .btn{width:100%}.definition-input{min-height:130px}}

/* Course library: light surfaces, blue accents, readable catalogue and preview. */
:root{--bg:#f7f9fd;--ink:#17243f;--muted:#69768c;--line:#dde4ef;--green:#2e5fa3;--lime:#dfebff;--orange:#f2cfa6;--white:#fff;--red:#b2443f}

 key:'cs-lab-v1',name:'CS Lab',short:'cs lab',subject:'Computer Science',board:'AQA',code:'7517',icon:'code',group:'AREA',

}:{

 tag:'OCR A · A LEVEL PHYSICS',spec:'https://www.ocr.org.uk/qualifications/as-and-a-level/physics-a-h156-h556-from-2015/'
};


/* Original AQA 7517-aligned Computer Science revision content. */
const MODULES=[
 {id:1,title:'Programming',full:'Programming, recursion and object orientation',icon:'code'},
 {id:2,title:'Structures & algorithms',full:'Data structures, algorithms and computation',icon:'chart'},
 {id:3,title:'Data representation',full:'Binary, real numbers, media and cryptography',icon:'ruler'},
 {id:4,title:'Computer systems',full:'Logic, architecture and system software',icon:'target'},
 {id:5,title:'Networks & security',full:'Communication, the Internet and security',icon:'orbit'},
 {id:6,title:'Data, methods & impact',full:'Databases, functional programming, development and impact',icon:'book'}
];
const TOPICS=[];
const findTopic=id=>TOPICS.find(t=>t.id===id);
let variantRng=null;
const pick=(n,a)=>variantRng?a[Math.floor(variantRng()*a.length)]:a[n%a.length];
const csText=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function csPrompt(s){const [first,...code]=s.split('\n');return csText(first)+(code.length?'<code class="cs-code">'+csText(code.join('\n'))+'</code>':'');}
function csTopic(id,module,code,title,notes,term,model,points,gapAnswer,gapPrompts,gapAccepted=[]){
 const t={id:'cs-'+id,module,code,title,lesson:notes,lessonSections:[{title:'First, understand the model',points:notes}],equation:'',questions:[],exam:null};TOPICS.push(t);
 const versions=['Define '+term+'.','What is meant by '+term+'?','State a precise definition of '+term+'.'].map(prompt=>({type:'definition',prompt,answer:model,keyPoints:points.map(([text,...patterns])=>({text,patterns})),explain:'Compare your wording with the key ideas; equivalent wording is accepted.'}));
 t.questions.push({...versions[0],id:t.id+'-definition',versions});
 const completed=gapPrompts[0].replace(/______/g,gapAnswer);
 const gaps=gapPrompts.map(prompt=>({type:'gap',prompt,answer:gapAnswer,accepted:[gapAnswer,...gapAccepted],definition:completed,explain:completed}));
 t.questions.push({...gaps[0],id:t.id+'-gap',versions:gaps});
}
function csSkill(topic,slug,prompts,correct,wrong,explain,retrieval=true){
 const t=findTopic('cs-'+topic),options=[correct,...wrong].map(csText);
 const versions=prompts.map(prompt=>({prompt:csPrompt(prompt),answer:options[0],options:[...options],explain,retrieval}));
 t.questions.push({...versions[0],id:t.id+'-'+slug,versions,learn:explain});
}
function csGenerated(topic,slug,teach,make){
 const t=findTopic('cs-'+topic),generator=n=>({...make(n),retrieval:false});
 const base=generator(0);t.questions.push({...base,id:t.id+'-'+slug,make:generator,learn:teach});
}
function csNumeric(prompt,value,wrong,explain){
 const answer=String(value),options=[answer,...wrong.map(String)].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);
 for(let i=1;options.length<4&&i<10;i++){const s=String(Number(value)+i);if(Number.isFinite(Number(value))&&!options.includes(s))options.push(s);}
 if(options.length!==4)throw Error('Need four distinct answers: '+prompt);
 return {prompt:csPrompt(prompt),answer:csText(answer),options:options.map(csText),explain};
}
function csExam(topic,context,parts){findTopic('cs-'+topic).exam={context:csPrompt(context),parts:parts.map(([question,marks,worked])=>[csPrompt(question),marks.map(csText),csText(worked)])};}
function finishCS(){
 for(const t of TOPICS){
  const mcq=t.questions.filter(q=>!q.type);
  t.lessonSections.push({title:'Key ideas for the questions',points:[...new Set(mcq.map(q=>q.learn))]});
  t.lessonSections.push({title:'Definition to remember',points:[t.questions.find(q=>q.type==='definition').answer]});
  t.lesson=t.lessonSections.flatMap(s=>s.points);
  if(!t.exam)throw Error('Missing exam set: '+t.id);
 }
}


csTopic('types',1,'4.1.1','Data types & expressions',[
'A data type determines the values a variable can hold and the operations allowed. Integers store whole numbers, real/float types approximate numbers with fractional parts, Booleans store true or false, and strings store sequences of characters.',
'Assignment stores a value; comparison produces a Boolean result. Integer division gives a quotient without the remainder; MOD gives the remainder. Convert strings explicitly before numerical arithmetic. Named constants make fixed values clear and easier to maintain.'
],'a variable','A named storage location whose value can change while a program executes.',[['Named storage','nam|identifier'],['Changeable value','chang|vari|assign']], 'Boolean',['A value that can only be true or false has the ______ data type.','A logical condition produces a ______ value.']);
csTopic('control',1,'4.1.1','Selection, iteration & files',[
'Sequence executes statements in order. Selection chooses a path using a condition. Definite iteration repeats a known number of times; indefinite iteration repeats until a condition changes.',
'A pre-condition loop may execute zero times; a post-condition loop executes at least once. Trace variables after each executed statement and watch inclusive bounds. Open files in the intended mode, process records carefully and close files; exceptions allow errors to be handled.'
],'iteration','The repeated execution of a sequence of instructions.',[['Repetition','repeat|repet'],['Instructions','instruction|statement|code|step|block']], 'selection',['Choosing a branch according to a condition is called ______.','An IF statement implements ______.']);
csTopic('subroutines',1,'4.1.1','Subroutines, scope & recursion',[
'A subroutine is a named reusable block. Parameters receive arguments from a call; a returned value can be used by the caller. Local variables belong to a call, whereas globals are accessible more widely.',
'Recursion solves a problem by calling the same subroutine on a smaller instance. A base case stops further calls, and every recursive step must progress towards it. The call stack stores pending calls, local state and return addresses.'
],'recursion','A technique in which a subroutine calls itself, directly or indirectly, with a stopping base case.',[['Self call','itself|self|same subroutine|same function'],['Stopping condition','base case|stop|terminat']], 'local',['A variable accessible only inside its subroutine is ______.','A variable whose scope is restricted to a function is ______.']);
csTopic('oop',1,'4.1.2','Object-oriented programming',[
'A class defines attributes and methods; an object is an instance with its own state. Constructors initialise new objects. Encapsulation keeps state and related operations together and restricts inappropriate direct access.',
'Inheritance specialises a parent class. Overriding supplies a subclass implementation of an inherited method; polymorphism lets the same interface invoke different implementations. Composition is a strong whole-part ownership relationship, while aggregation allows the part to exist independently.'
],'encapsulation','Bundling data with the methods that operate on it and restricting direct access to the internal state.',[['Data and methods','data|state|attribute'],['Restricted access','restrict|private|hid|protect|control.*access']], 'class',['An object is an instance of a ______.','The blueprint defining common attributes and methods is a ______.']);
csTopic('structures',2,'4.2','Arrays, records & dictionaries',[
'Choose a structure to match the operations required. An array supports indexed access; a record groups related fields, possibly of different types. A dictionary maps unique keys to values.',
'A hash function maps a key to a table index. Different keys can collide, so the implementation needs a collision strategy such as chaining or probing. A vector is an ordered collection of numerical components, not just a physical direction arrow.'
],'a data structure','A way of organising and storing data to support particular operations efficiently.',[['Organisation of data','organi|arrang|structur'],['Data storage','data|value|item']], 'key',['A dictionary retrieves a value using its ______.','The identifier used to look up a dictionary entry is its ______.']);
csTopic('stacks',2,'4.2','Stacks & queues',[
'A stack is last-in, first-out: push adds and pop removes at the top; peek inspects without removal. Stacks support recursion, undo and expression evaluation.',
'A queue is first-in, first-out: enqueue at the rear and dequeue at the front. A circular queue reuses array space by wrapping indices. Distinguish empty, full, overflow and underflow conditions; maintain a count or another rule to distinguish full from empty.'
],'a stack','A last-in, first-out data structure in which items are added and removed at the top.',[['Last in first out','last.*first|lifo'],['Same end','top|same end']], 'queue',['A first-in, first-out structure is a ______.','A print spooler normally processes jobs using a ______.']);
csTopic('trees',2,'4.2','Trees, graphs & representations',[
'A graph has vertices connected by edges, which may be directed or weighted. An adjacency matrix records connections in a table; an adjacency list records neighbours for each vertex.',

csTopic('searchsort',2,'4.3','Searching, sorting & complexity',[
'Linear search examines items in turn and works on unsorted data. Binary search repeatedly discards half a sorted search interval. State whether a complexity claim is worst case, average case or best case.',

],'an algorithm','A finite sequence of unambiguous instructions for solving a problem or carrying out a task.',[['Finite instructions','finite|terminat'],['Clear steps','unambiguous|precise|clear|well.defined']], 'sorted',['Binary search requires the data to be ______.','Before applying binary search to an unordered array, it must be ______.'],['ordered']);
csTopic('traversals',2,'4.3','Traversals & Reverse Polish',[

'For a binary tree, pre-order visits root, left, right; in-order visits left, root, right; post-order visits left, right, root. Apply the rule recursively to each subtree. In-order outputs a binary search tree in ascending order.',

],'breadth-first search','A graph traversal that visits vertices level by level using a queue.',[['Level order','level|layer|breadth'],['Queue','queue|fifo|first.*first']], 'post-order',['The tree traversal that visits left, then right, then root is ______.','Visiting both subtrees before the root is ______ traversal.'],['postorder','post order']);
csTopic('computation',2,'4.4','Abstraction, languages & machines',[
'Abstraction removes irrelevant detail to focus on the features needed for a problem. A finite state machine has a finite set of states and transitions determined by input; some models also produce outputs.',

csTopic('crypto',3,'4.5','Encryption & information coding',[
'Encryption turns plaintext into ciphertext using an algorithm and key; decryption reverses it with an appropriate key. A substitution or transposition cipher is a model of an algorithm, not evidence that every implementation is secure.',
'Symmetric encryption uses a shared secret key; asymmetric encryption uses a related public-private key pair. For confidential messages to a recipient, encrypt using their public key and decrypt using their private key. A cryptographic hash produces a fixed-length digest and is not reversible encryption; passwords should be salted and hashed.'
],'encryption','Transforming plaintext into ciphertext using an algorithm and a key to make the data unintelligible without the appropriate key.',[['Plain to cipher','plaintext|plain text|readable'],['Key and protection','key'],['Ciphertext','ciphertext|cipher text|unintelligible|unreadable']], 'private',['In public-key encryption, the recipient keeps their ______ key secret.','A recipient decrypts a confidential message using their ______ key.']);
csTopic('logic',4,'4.6','Logic gates & Boolean algebra',[
'NOT inverts a Boolean value. AND is true only if both inputs are true; inclusive OR if at least one is true; XOR if exactly one is true. NAND and NOR invert the corresponding outputs.',
'Build a truth table systematically, listing every input combination once. De Morgan’s laws swap AND with OR when negating a bracket and negate each input. Use brackets and operator precedence carefully; a logic expression’s symbols represent operations, not decimal arithmetic.'
],'a Boolean expression','An expression that evaluates to one of the two logical values true or false.',[['Expression or operation','expression|operation|statement|condition'],['True or false','true.*false|false.*true|two.*logical|boolean']], 'XOR',['The gate that outputs true when exactly one of two inputs is true is ______.','Exclusive OR is usually abbreviated ______.'],['exclusive or']);
csTopic('architecture',4,'4.7','CPU, memory & storage',[

'The CPU executes instructions through fetch, decode and execute. The program counter identifies the next instruction address; the MAR selects a memory location, the MDR carries transferred data, and the current instruction register holds the instruction being decoded.',
'The control unit coordinates operations; the ALU performs arithmetic and logic. Address, data and control buses have different roles. Cache holds frequently needed data or instructions near the CPU; RAM is volatile working memory, while secondary storage persists without power. Von Neumann stores instructions and data in shared memory.'
],'cache memory','Small, fast memory close to the processor that stores frequently or recently used data and instructions to reduce access time.',[['Fast memory','fast|high.speed'],['Reused content','frequent|recent|often'],['Processor access','processor|cpu|access']], 'volatile',['Memory that loses its stored contents when power is removed is ______.','RAM is normally ______, unlike secondary storage.']);
csTopic('software',4,'4.6–4.7','System software & languages',[
'An operating system manages processor time, memory, files and devices and provides services to applications. Interrupts request attention; the CPU saves enough state to resume after the handler. Virtual memory uses backing storage to extend the address space but is slower than RAM access.',
'A compiler translates source into target code; an interpreter executes through translation at runtime. An assembler translates assembly mnemonics. Syntax errors break language rules, logic errors produce wrong behaviour, and runtime errors arise during execution. Machine code is directly executed; assembly is a symbolic low-level representation.'
],'an operating system','System software that manages computer hardware resources and provides services and an interface for applications and users.',[['Resource management','manag|allocat|schedul'],['Hardware or services','resource|hardware|memory|processor|device|service']], 'assembler',['The translator for assembly language into machine code is an ______.','Assembly mnemonics are converted into machine instructions by an ______.']);
csTopic('communications',5,'4.9','Communication & network design',[
'Serial transmission sends bits sequentially over a channel; parallel transmission uses multiple lines. Synchronous communication coordinates timing; asynchronous communication uses framing such as start and stop bits. Baud rate counts symbols per second and is not always equal to bit rate.',
'A LAN covers a limited site; a WAN connects over larger distances. Switches forward frames within a network; routers forward packets between networks. Star and bus topologies have different resilience and cabling trade-offs. Wi-Fi uses shared radio channels and must account for interference and security.'
],'a protocol','An agreed set of rules governing communication between devices.',[['Agreed rules','rule|convention|agreement'],['Communication','communicat|transmi|exchange|device']], 'router',['Packets are forwarded between different networks by a ______.','A device connecting IP networks and choosing onward paths is a ______.']);
csTopic('internet',5,'4.9','Internet, TCP/IP & web systems',[
'The Internet connects networks; the Web is one service using it. DNS resolves domain names to IP addresses. IP addresses support routing; a subnet mask separates network and host bits. A port identifies an application endpoint on a host.',
'In the TCP/IP model, application protocols use transport services, IP handles routing and link protocols carry data locally. TCP provides reliable ordered delivery; UDP avoids that reliability overhead. HTTP uses requests and responses; REST resources are addressed by URLs and acted on using methods such as GET and POST. JSON represents structured data.'
],'packet switching','Splitting data into packets that are routed across a network and reassembled at the destination.',[['Packets','packet'],['Routing or destination','rout|destination|reassembl|independen']], 'DNS',['The service that resolves domain names to IP addresses is ______.','Name resolution from a web domain to an IP address uses ______.'],['domain name system']);
csTopic('security',5,'4.9','Network security & authentication',[
'Distinguish authentication, proving identity, from authorisation, deciding permissions. Use least privilege, strong authentication, patching and access controls rather than relying on one defence. A firewall filters traffic according to rules; it does not guarantee that all permitted content is safe.',
'Phishing tricks people into disclosing information; malware executes unwanted actions. Encryption protects confidentiality, while secure hashes and signatures support integrity and authenticity in appropriate protocols. Backups support recovery and should be tested and protected from the same failures as the live system.'
],'authentication','Checking that a user or device is who it claims to be.',[['Check identity','check|verif|confirm|prov'],['Identity','identity|who|claim']], 'authorisation',['Deciding which resources an authenticated user may access is ______.','Permission to perform an operation is controlled by ______.'],['authorization']);
csTopic('databases',6,'4.10','Relational databases & SQL',[
'A relational database stores data in related tables. A primary key uniquely identifies a row; a foreign key references a key in another table. Referential integrity prevents references to nonexistent related rows.',
'SELECT chooses fields, FROM identifies tables, WHERE filters rows and ORDER BY sorts results. JOIN combines related rows through matching keys; GROUP BY forms groups and aggregate functions summarise them. Distinguish COUNT(*) from COUNT(column), which excludes NULL values. Parameterised queries separate data from SQL instructions.'
],'a primary key','A field or combination of fields whose value uniquely identifies each row in a table.',[['Unique identification','unique'],['Rows or records','row|record|tuple']], 'foreign',['A key that references a key in another table is a ______ key.','A ______ key links a record to a related table.']);
csTopic('normalisation',6,'4.10','Data modelling & normalisation',[
'Normalisation uses dependencies to reduce redundancy and insertion, update and deletion anomalies. In first normal form, values are atomic and repeating groups have been removed.',
'Second normal form removes partial dependencies on part of a composite candidate key. Third normal form also removes transitive dependencies between non-key attributes. Identify entities and keys, then split tables so each fact is stored in the appropriate place while relationships remain represented by keys.'

],'a functional dependency','A relationship in which a value of one attribute or attribute set determines exactly one value of another attribute.',[['Determines','determin|uniquely.*identif'],['Attributes','attribute|field|column']], 'atomic',['First normal form requires each stored field value to be ______.','A value that cannot be split into multiple values for the database’s intended use is ______.']);
csTopic('bigdata',6,'4.11','Big Data & distributed processing',[
'Big Data is characterised by volume, velocity and variety. Large, rapid, heterogeneous datasets can exceed what conventional single-machine tools handle conveniently. Data quality and provenance still matter; more data does not automatically remove bias.',
'Distributed processing divides work across machines. In MapReduce, map produces intermediate key-value data, grouping brings matching keys together and reduce combines values. Fact-based representations express information through facts and relationships. Link analysis such as PageRank uses graph structure; a useful correlation alone does not prove causation.'
],'distributed processing','Dividing a processing task across multiple connected computers that work together.',[['Multiple computers','multiple|several|many|more than one'],['Shared task','task|work|process']], 'velocity',['The rate at which Big Data is generated and arrives is its ______.','Of the three Vs, ______ concerns the speed of data arrival.']);
csTopic('functional',6,'4.12','Functional programming',[
'A pure function’s result depends only on its arguments and it has no side effects. Functional approaches favour immutable values and functions as first-class values that can be passed, returned and stored.',
'A higher-order function takes a function as an argument or returns one. map transforms each item; filter retains items meeting a predicate; reduce combines items into an accumulated result. Composition feeds one function’s output to another. Partial application fixes some arguments to produce a new function.'
],'a pure function','A function whose output depends only on its inputs and which has no side effects.',[['Input determines output','input|argument|parameter'],['No side effects','no side effect|without side effect|side.effect.free']], 'filter',['The operation that retains only values satisfying a predicate is ______.','Use ______ to keep only matching elements without transforming each retained value.']);
csTopic('development',6,'4.13–4.14','Development, testing & the project',[
'Start with a clearly analysed problem, stakeholders and measurable objectives. Decompose the solution into manageable parts, design algorithms and data structures, implement them and test against requirements. A prototype gathers feedback; iteration refines the design.',
'Validation checks whether input follows rules; verification checks whether data has been copied or entered as intended. Test normal, boundary and invalid cases, record expected outcomes before executing and compare actual results. The practical project also needs evidence of design decisions, technical solution, testing and evaluation against objectives.'
],'validation','Checking that input data satisfies specified rules or constraints.',[['Checking','check|test|ensur'],['Rules or constraints','rule|constraint|range|format|requirement']], 'boundary',['Values at the edges of an allowed range are ______ test data.','Testing just at, just below and just above a limit is ______ testing.']);
csTopic('ethics',6,'4.8','Computing, society & responsibility',[
'Computing systems affect privacy, autonomy, accessibility, employment and the environment. Identify stakeholders and explain a concrete benefit, risk and mitigation rather than listing vague advantages and disadvantages.',
'Algorithms can embed assumptions and amplify bias in data. Law, ethical acceptability and technical possibility are different questions. Data protection involves fair handling, limited purposes, security and appropriate retention; accessibility includes users with different abilities and circumstances. Evaluate alternatives and justify trade-offs in context.'
],'algorithmic bias','Systematic unfairness in a computational system’s outcomes that disadvantages particular people or groups.',[['Systematic unfairness','systematic|unfair|prejud|discrimin'],['Affected people','people|group|person|user|demograph']], 'privacy',['Control over access to a person’s information is associated with ______.','Unnecessary collection of identifiable personal data can threaten ______.']);

function chooseQuestionVersion(skill){
 progress.variantBags||={};progress.variantLast||={};
 const key=skill.variantKey||skill.id;
 const last=progress.variantLast[key];let variant;
 if(skill.make){
  for(let attempt=0;attempt<32;attempt++){
   let seed=1+Math.floor(Math.random()*2147483646);
   variantRng=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
   try{variant=skill.make(seed);}finally{variantRng=null;}
   if((variant.type==='cloze'?JSON.stringify(variant.cards):variant.prompt)!==last)break;
  }
 }else if(skill.versions){
  let bag=progress.variantBags[key];
  if(!Array.isArray(bag)||!bag.length||bag.some(i=>!Number.isInteger(i)||!skill.versions[i])){
   bag=shuffle(skill.versions.map((_,i)=>i));
   if(bag.length>1&&skill.versions[bag[0]].prompt===last)[bag[0],bag[1]]=[bag[1],bag[0]];
   progress.variantBags[key]=bag;
  }
  variant=skill.versions[bag.shift()];
 }else variant=skill;
 progress.variantLast[key]=variant.type==='cloze'?JSON.stringify(variant.cards):variant.prompt;return variant;
}
/* Small synthesized earcons: no downloads, autoplay or external audio files. */
const Sound=(()=>{
 const volume=0.55;
 const key='physics-lab-audio-v1';
 let enabled=true,context=null,master=null,unavailable=false,resumePending=null,epoch=0;
 const voices=new Set();
 try{const value=JSON.parse(localStorage.getItem(key));if(typeof value==='boolean')enabled=value;}catch{}
 function ensure(){
  if(context&&context.state!=='closed')return context;
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio){unavailable=true;return null;}
  try{context=new Audio({latencyHint:'interactive'});master=context.createGain();master.gain.value=enabled?volume:0;master.connect(context.destination);return context;}catch{unavailable=true;return null;}
 }
 function unlock(){
  if(!enabled)return;
  const ctx=ensure();if(!ctx)return;
  if(ctx.state==='suspended'){try{if(!resumePending)resumePending=Promise.resolve(ctx.resume()).then(()=>{resumePending=null;}).catch(()=>{resumePending=null;});return resumePending;}catch{}}
  return null;
 }
 function tone(ctx,frequency,offset,duration,volume=0.14,type='sine',endFrequency=frequency){
  const osc=ctx.createOscillator(),gain=ctx.createGain(),start=ctx.currentTime+0.008+offset;
  osc.type=type;osc.frequency.setValueAtTime(frequency,start);
  if(endFrequency!==frequency)osc.frequency.exponentialRampToValueAtTime(endFrequency,start+duration*0.72);
  gain.gain.setValueAtTime(0,start);
  gain.gain.linearRampToValueAtTime(volume,start+0.003);
  gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
  osc.connect(gain);gain.connect(master);voices.add(osc);
  osc.onended=()=>{voices.delete(osc);osc.disconnect();gain.disconnect();};
  osc.start(start);osc.stop(start+duration+0.012);
 }
 function play(kind,level=0){
  if(!enabled)return false;
  const ctx=ensure();if(!ctx)return false;
  // A user gesture unlocks the context; a blocked browser stays silent.
  const requestedEpoch=epoch,pending=unlock();
  if(ctx.state!=='running'){
   if(pending)pending.then(()=>{if(enabled&&epoch===requestedEpoch&&context===ctx&&ctx.state==='running')play(kind,level);}).catch(()=>{});
   return false;
  }
  try{
   if(kind==='correct'){
    // Two rounded, downward-swept bubbles: short bodies, no bell overtones.
    tone(ctx,620,0.018,0.080,0.17,'sine',370);
    tone(ctx,860,0.066,0.105,0.115,'sine',510);
   }else if(kind==='incorrect'){
    tone(ctx,230,0.025,0.085,0.085,'sine',165);
   }else if(kind==='finish'){
    tone(ctx,420,0.015,0.075,0.105,'sine',285);
    tone(ctx,560,0.070,0.080,0.10,'sine',365);
    tone(ctx,720,0.125,0.115,0.115,'sine',465);
   }else if(kind==='fruit-drop'){
    // A compact low thup with a soft, quickly falling top.
    tone(ctx,240,0,0.075,0.12,'sine',82);
    tone(ctx,470,0,0.025,0.035,'sine',190);
   }else if(kind==='fruit-merge'||kind==='fruit-big-merge'){
    const size=Math.max(0,Math.min(11,Number(level)||0));
    const pitch=420+size*32;
    tone(ctx,pitch,0,0.10,0.15,'sine',pitch*.48);
    tone(ctx,pitch*1.36,0.035,0.10,0.085,'sine',pitch*.72);
    if(kind==='fruit-big-merge')tone(ctx,160,0.012,0.14,0.13,'sine',65);
   }else if(kind==='tap'||kind==='start'){
    // A soft dry tick rather than a pitched UI beep.
    tone(ctx,440,0,0.026,0.065,'sine',190);   }else return false;
   return true;
  }catch{return false;}
 }
 function speaker(){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/>'+(enabled?'<path d="M16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14"/>':'<path d="m17 9 5 6m0-6-5 6"/>')+'</svg>';
 }
 function markup(){
  return '<button type="button" class="sound-toggle" data-sound-toggle aria-pressed="'+enabled+'" aria-label="'+(enabled?'Mute revision sounds':'Enable revision sounds')+'" title="'+(enabled?'Mute sounds':'Enable sounds')+'">'+speaker()+'<span>Sound '+(enabled?'on':'off')+'</span></button>';
 }
 function refresh(){
  document.querySelectorAll?.('[data-sound-toggle]').forEach(button=>{
   button.setAttribute('aria-pressed',String(enabled));
   button.setAttribute('aria-label',unavailable?'Sound is unavailable in this browser':enabled?'Mute revision sounds':'Enable revision sounds');
   button.title=unavailable?'Sound unavailable':enabled?'Mute sounds':'Enable sounds';
   button.innerHTML=speaker()+'<span>Sound '+(enabled?'on':'off')+'</span>';
  });
 }
 function toggle(){
  enabled=!enabled;epoch++;
  try{localStorage.setItem(key,JSON.stringify(enabled));}catch{}
  if(!enabled&&context){
   const now=context.currentTime;
   try{master.gain.cancelScheduledValues(now);master.gain.setTargetAtTime(0,now,0.004);}catch{}
   for(const voice of voices){try{voice.stop(now+0.012);}catch{}}
  }else if(enabled){
   unlock();
   if(master&&context){master.gain.cancelScheduledValues(context.currentTime);master.gain.setValueAtTime(volume,context.currentTime);}
   play('tap');
  }
  refresh();return enabled;
 }
 document.addEventListener('pointerdown',unlock,{passive:true});

 // Capture before navigation can replace the clicked button. Native keyboard
 // activation also produces a click, so every enabled button gets one tap.
 document.addEventListener('click',event=>{
  const button=event.target.closest?.('button');
  if(!button||button.disabled||button.getAttribute?.('aria-disabled')==='true')return;
  if(button.hasAttribute('data-sound-toggle')){toggle();return;}
  play('tap');
 },true);
 return {play,unlock,toggle,markup,isEnabled:()=>enabled};
})();


function isTyped(q){return q.type==='definition'||q.type==='gap';}
function questionsFor(t,kind=mode){
 const mcq=t.questions.filter(q=>!isTyped(q));
 if(kind==='suika'||(kind==='rush'&&rushVariant==='suika'))return mcq;
 if(kind==='rush')return mcq.flatMap(q=>{const versions=(q.versions||[q]).filter(v=>v.retrieval);return versions.length?[{...q,versions,variantKey:q.id+'-retrieval',make:undefined,retrieval:true}]:[];});
 const written=t.questions.filter(isTyped),mixed=[];
 mcq.forEach((q,i)=>{mixed.push(q);if((i+1)%3===0&&written.length)mixed.push(written.shift());});
 return mixed.concat(written);
}
function normaliseAnswer(value){return String(value).normalize('NFKC').toLowerCase().replace(/[’']/g,'').replace(/(\d)([a-z])/g,'$1 $2').replace(/[^a-z0-9%]+/g,' ').replace(/\s+/g,' ').trim();}
function oneTypo(a,b){
 if(a===b)return true;
 if(a.length<6||b.length<6||a.includes(' ')||b.includes(' ')||Math.abs(a.length-b.length)>1)return false;
 if(a.length===b.length){const wrong=[];for(let i=0;i<a.length;i++)if(a[i]!==b[i])wrong.push(i);return wrong.length===1||(wrong.length===2&&wrong[1]===wrong[0]+1&&a[wrong[0]]===b[wrong[1]]&&a[wrong[1]]===b[wrong[0]]);}
 if(a.length>b.length)[a,b]=[b,a];
 let i=0,j=0,skipped=false;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;}else{if(skipped)return false;skipped=true;j++;}}return true;
}
function gradeTyped(q,response){

 if(q.type==='gap'){const accepted=(q.accepted||[q.answer]).map(normaliseAnswer);return {correct:accepted.some(a=>oneTypo(text,a)),matches:[],negated:false};}
 const matches=q.keyPoints.map(p=>p.patterns.some(pattern=>new RegExp(pattern,'i').test(text)));
 const negated=/\b(?:not|never|no)\s+(?:(?:the|a|an)\s+)?(?:rate|sum|total|force|energy|charge|magnitude|direction|proportional|flow|per)\b/.test(text);
 return {correct:matches.every(Boolean)&&!negated,matches,negated};
}

 const value=session.answered?session.choice:(session.typedDraft||'');
 const label=q.type==='gap'?'Type the missing word or phrase':'Write the definition in your own words';
 const field=q.type==='gap'?'<input id="typed-answer" class="typed-input" type="text" maxlength="120" autocomplete="off" spellcheck="true" value="'+escapeHTML(value)+'" '+(session.answered?'readonly':'')+'>':'<textarea id="typed-answer" class="typed-input definition-input" maxlength="1500" spellcheck="true" '+(session.answered?'readonly':'')+'>'+escapeHTML(value)+'</textarea>';

}
function checkTyped(provided){
 if(!session||view!=='session'||session.phase==='lesson'||session.answered||session.kind==='rush')return false;
 const q=currentQuestion();if(!isTyped(q)||q.type==='cloze')return false;
 const response=String(typeof provided==='string'?provided:($('#typed-answer')?.value||'')).trim().slice(0,q.type==='gap'?120:1500);
 if(!response){const error=$('#typed-error');if(error)error.textContent='Type an answer before checking.';$('#typed-answer')?.setAttribute('aria-invalid','true');return false;}
 const grade=gradeTyped(q,response),previous=progress.answers[q.id]||{};
 session.choice=response;session.typedDraft=response;session.answered=true;session.reviewOpen=false;
 session.results.push({...q,choice:response,correct:grade.correct,matches:grade.matches,negated:grade.negated,previousCorrect:!!previous.correct,reviewed:false});
 progress.attempts++;if(grade.correct)progress.correct++;
 progress.answers[q.id]={correct:!!(previous.correct||grade.correct),lastCorrect:grade.correct,attempts:(previous.attempts||0)+1};
 persist();Sound.play(grade.correct?'correct':'incorrect');updateTypedDisplay();return true;
}
function typedFeedback(q){
 const r=session.results[session.results.length-1];if(!r||r.id!==q.id)return '';
 let html='<div class="feedback '+(r.correct?'':'wrong')+'" role="status"><strong>'+(r.correct?(q.type==='gap'?'✓ That’s right.':'✓ Key ideas found.'):(q.type==='gap'?'Check the missing word.':'Check these key ideas.'))+'</strong>';
 if(q.type==='gap')return html+'<p>Answer: <b>'+escapeHTML(q.answer)+'</b></p><p style="margin-top:8px">'+escapeHTML(q.explain)+'</p></div>';
 html+='<div class="model-definition"><span>MODEL DEFINITION</span><p>'+escapeHTML(q.answer)+'</p></div>';
 if(r.negated&&!r.reviewed)html+='<p class="hint">Your wording appears to negate an essential idea. Compare it with the model definition.</p>';
 html+='<ul class="definition-points">'+q.keyPoints.map((p,i)=>'<li class="'+(r.matches[i]?'matched':'missing')+'"><span aria-hidden="true">'+(r.matches[i]?'✓':'○')+'</span>'+escapeHTML(p.text)+'</li>').join('')+'</ul>';
 if(session.reviewOpen){html+='<div class="typed-review"><b>Review equivalent wording</b><p class="hint">Tick only the ideas your original answer included. This adjusts this attempt without adding another one.</p>'+q.keyPoints.map((p,i)=>'<label class="mark-point"><input type="checkbox" data-typed-point="'+i+'" '+(r.matches[i]?'checked':'')+'><span>'+escapeHTML(p.text)+'</span></label>').join('')+'<button class="btn light" type="button" id="save-typed-review">Save reviewed result</button></div>';}
 else html+='<button class="btn ghost" type="button" id="review-typed">'+(r.reviewed?'Review your wording again':'Equivalent wording? Review the key ideas')+'</button>';
 return html+'</div>';
}
function saveTypedReview(provided){
 if(!session||!session.answered||session.kind==='rush'||!isTyped(currentQuestion()))return;
 const q=currentQuestion(),r=session.results.at(-1);if(q.type!=='definition'||r.id!==q.id)return;
 const flags=Array.isArray(provided)?provided:Array.from(document.querySelectorAll('[data-typed-point]')).map(el=>el.checked);
 if(flags.length!==q.keyPoints.length)return;
 const correct=flags.every(Boolean);if(correct&&!r.correct)Sound.play('correct');progress.correct+=Number(correct)-Number(r.correct);
 r.correct=correct;r.matches=flags;r.reviewed=true;session.reviewOpen=false;
 const previous=progress.answers[q.id];previous.correct=!!(r.previousCorrect||correct);previous.lastCorrect=correct;
 persist();updateTypedDisplay();
}
function updateTypedDisplay(){
 updateSessionAnswerBar();
 const form=$('#typed-form');if(!form?.isConnected){questionView();return;}
 const q=currentQuestion(),r=session.results.at(-1),input=$('#typed-answer');
 input.readOnly=true;input.removeAttribute('aria-invalid');input.classList.toggle('accepted',r.correct);input.classList.toggle('needs-review',!r.correct);

/* Three inline definition challenges, restricted to Learn & quiz. */
const clozeStop=new Set('a an the is are was were be being been of in on at to for from by with and or as that which whose its it this one per unit same used using through into when than each any can has have only both number value quantity'.split(' '));
function clozeWords(text){return [...text.matchAll(/[A-Za-z]+(?:[-'][A-Za-z]+)*/g)].filter(m=>m[0].length>3&&!clozeStop.has(m[0].toLowerCase()));}
function clozeCard(text){
 const candidates=clozeWords(text),distinct=[...new Map(candidates.map(m=>[m[0].toLowerCase(),m])).values()];
 const chosen=shuffle(distinct).slice(0,Math.min(2,Math.max(1,Math.floor(distinct.length/3)))).sort((a,b)=>a.index-b.index);
 let cursor=0;const parts=[],answers=[];for(const m of chosen){parts.push(text.slice(cursor,m.index));answers.push(m[0]);cursor=m.index+m[0].length;}parts.push(text.slice(cursor));return {text,parts,answers};
}
for(const t of TOPICS){
 t.clozeLabels={};for(const q of t.questions.filter(q=>q.type==='definition'))t.clozeLabels[q.answer]=q.prompt.replace(/^Define /,'').replace(/[.]$/,'');
 const originals=t.questions.filter(q=>q.type==='definition'||q.type==='gap').flatMap(q=>[q,...(q.versions||[])]).map(q=>q.type==='definition'?q.answer:q.definition).filter(Boolean);
 t.clozeDefinitions=[...new Set([...originals,...(extraDefinitions[t.id]||[])])].filter(s=>!s.includes('___')&&clozeWords(s).length);
 if(t.clozeDefinitions.length<3)throw Error('Need three definitions: '+t.id);
 const extras=(extraDefinitions[t.id]||[]).filter(s=>!originals.includes(s));
 if(extras.length&&t.lessonSections){t.lessonSections.push({title:'More definitions to know',points:extras});t.lesson=t.lessonSections.flatMap(s=>s.points);}
}
const originalQuestionsFor=questionsFor;
questionsFor=function(t,kind=mode){
 const list=originalQuestionsFor(t,kind);if(kind!=='learn')return list;
 const index=list.findIndex(isTyped);if(index<0)return list;
 const base=list[index];list[index]={...base,type:'cloze',versions:undefined,learn:'',make:()=>{
  progress.clozeLast||={};let cards;
  for(let i=0;i<12;i++){cards=shuffle(t.clozeDefinitions).slice(0,3).map(text=>({...clozeCard(text),label:t.clozeLabels[text]||''}));if(JSON.stringify(cards)!==progress.clozeLast[t.id])break;}
  progress.clozeLast[t.id]=JSON.stringify(cards);
  return {type:'cloze',prompt:'Complete the definitions',cards,answer:cards.map(c=>c.text).join(' '),explain:'The complete definitions are shown above.'};
 }};return list;
};
const originalIsTyped=isTyped;isTyped=q=>q.type==='cloze'||originalIsTyped(q);
function clozeState(q){
 if(!session.cloze||session.cloze.index!==session.index)session.cloze={index:session.index,active:0,values:q.cards.map(c=>c.answers.map(()=>'')),accepted:q.cards.map(c=>c.answers.map(()=>false)),revealed:false};
 return session.cloze;
}
function renderCloze(q){

 return '<div class="cloze-round"><section class="cloze-card '+(complete?'complete':'')+'" data-cloze-card="'+i+'"><h3>'+(card.label?escapeHTML(card.label):'Complete the definition')+'</h3><p class="cloze-sentence">'+card.parts.map((part,j)=>escapeHTML(part)+(j<card.answers.length?'<input type="text" class="cloze-word '+(s.accepted[i][j]?'accepted':'')+'" data-cloze="'+i+'" data-word="'+j+'" aria-label="Definition '+(i+1)+', missing word '+(j+1)+'" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60" style="width:'+Math.max(7,card.answers[j].length+2)+'ch" value="'+escapeHTML(s.values[i][j])+'" '+(session.answered||s.accepted[i][j]?'readonly':'')+'>':'')).join('')+'</p></section>'+(!session.answered?'<button type="button" class="btn light" id="reveal-cloze">Reveal words</button>':'')+'</div>';
}
const originalRenderResponse=renderResponse;renderResponse=q=>q.type==='cloze'?renderCloze(q):originalRenderResponse(q);
const originalTypedFeedback=typedFeedback;typedFeedback=function(q){
 if(q.type!=='cloze')return originalTypedFeedback(q);const r=session.results.at(-1);
 return '<div class="feedback '+(r?.correct?'':'wrong')+'" role="status"><strong>'+(r?.correct?'That’s right.':'Words revealed.')+'</strong><p class="model-definition">'+escapeHTML(q.answer)+'</p>'+(q.explain&&q.explain!==q.answer?'<p>'+escapeHTML(q.explain)+'</p>':'')+'</div>';
};
function finishCloze(reveal=false){
 if(!session||session.kind!=='learn'||view!=='session'||session.phase==='lesson'||session.answered)return;
 const q=currentQuestion();if(q.type!=='cloze')return;const s=clozeState(q);
 if(!reveal&&!s.accepted.every(row=>row.every(Boolean)))return;
 s.revealed=reveal;session.choice=s.values.map(row=>row.join(', ')).join('; ');session.answered=true;
 const skillId=q.clozeSkillId||q.id,correct=!reveal,previous=progress.answers[skillId]||{};session.results.push({...q,choice:reveal?'Words revealed':session.choice,correct});
 progress.attempts++;if(correct)progress.correct++;progress.answers[skillId]={correct:!!(previous.correct||correct),lastCorrect:correct,attempts:(previous.attempts||0)+1};
 if(reveal){s.values=q.cards.map(c=>[...c.answers]);s.accepted=q.cards.map(c=>c.answers.map(()=>true));}
 persist();Sound.play(correct?'correct':'incorrect');questionView();
}
function acceptCloze(input){
 if(input.isComposing||!session||session.kind!=='learn'||view!=='session'||session.phase==='lesson'||session.answered)return;
 const q=currentQuestion();if(q.type!=='cloze')return;const s=clozeState(q),i=Number(input.dataset.cloze),j=Number(input.dataset.word);
 if(i!==s.active||!q.cards[i]?.answers[j]||s.accepted[i][j])return;s.values[i][j]=input.value;
 if(normaliseAnswer(input.value)!==normaliseAnswer(q.cards[i].answers[j]))return;
 s.accepted[i][j]=true;input.value=q.cards[i].answers[j];s.values[i][j]=input.value;input.readOnly=true;input.classList.add('accepted');
 if(s.accepted[i].every(Boolean)){
  if(s.accepted.every(row=>row.every(Boolean))){finishCloze();return;}
  return;
 }
 const next=document.querySelector('.cloze-word:not([readonly])');next?.focus();
}
document.addEventListener('input',event=>{if(event.target.dataset?.cloze!==undefined&&!event.isComposing)acceptCloze(event.target);});
document.addEventListener('compositionend',event=>{if(event.target.dataset?.cloze!==undefined)acceptCloze(event.target);});
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.id==='reveal-cloze')finishCloze(true);});

function spaceDefinitionQuestions(queue){
 const round=queue.find(q=>q.type==='cloze');if(!round)return queue;
 const ordinary=queue.filter(q=>q.type!=='cloze'&&q.type!=='gap');
 const easy=ordinary.filter(q=>q.difficulty!=='hard'),hard=ordinary.filter(q=>q.difficulty==='hard');
 const cards=round.cards.map(card=>{
  let hash=2166136261;for(const char of card.text)hash=Math.imul(hash^char.charCodeAt(0),16777619)>>>0;
  return {...round,id:round.id+'-cloze-'+hash,clozeSkillId:round.id,cards:[card],prompt:'Complete the definition',answer:card.text,explain:definitionExplanation(card,round.topic)};
 });
 const slots=cards.map((_,i)=>Math.max(2,Math.round((i+1)*easy.length/cards.length)));
 const result=[];easy.forEach((q,i)=>{result.push(q);cards.forEach((card,j)=>{if(slots[j]===i+1)result.push(card);});});
 return [...result,...hard];
}

function definitionExplanation(card,topicId){
 const topic=findTopic(topicId),model=topic?.questions.find(q=>q.type==='definition'&&q.answer===card.text);
 return model?.keyPoints?.length?'The essential ideas are: '+model.keyPoints.map(p=>p.text).join('; ')+'.':card.text;
}

/* Suika-style fruit-drop mechanics with original canvas fruit artwork. */
const FRUITS=[
 {name:'Cherry',r:14,color:'#e65a65',edge:'#b6384f'},
 {name:'Strawberry',r:20,color:'#f07789',edge:'#c94762'},
 {name:'Grape',r:26,color:'#a987d8',edge:'#7856a9'},

 {name:'Pear',r:53,color:'#d5dd80',edge:'#9eab49'},
 {name:'Peach',r:62,color:'#f5b5ad',edge:'#d98987'},
 {name:'Pineapple',r:73,color:'#edcf69',edge:'#bd9d39'},

 {name:'Watermelon',r:99,color:'#79b889',edge:'#43835d'}

class FruitWorld{
 constructor({rng=Math.random,onMerge=()=>{},onLose=()=>{}}={}){
  this.rng=rng;this.onMerge=onMerge;this.onLose=onLose;this.fruits=[];this.effects=[];
  this.width=400;this.height=560;this.left=18;this.right=382;this.floor=542;this.line=105;
  this.time=0;this.score=0;this.credits=0;this.drops=0;this.merges=0;this.largest=0;
  this.over=false;this.danger=0;this.lastDrop=-1;this.current=this.randomFruit();this.next=this.randomFruit();this.aim=200;this.serial=0;
 }
 randomFruit(){const r=this.rng();return r<.27?0:r<.53?1:r<.75?2:r<.91?3:4;}
 grantDrops(n=3){if(!this.over)this.credits+=n;}
 canDrop(){return !this.over&&this.credits>0&&this.time-this.lastDrop>=.38;}
 setAim(x){const r=FRUITS[this.current].r;this.aim=Math.max(this.left+r+1,Math.min(this.right-r-1,x));return this.aim;}
 make(level,x,y,vx=0,vy=0){return {id:++this.serial,level,r:FRUITS[level].r,x,y,vx,vy,angle:0,spin:0,age:0,removed:false};}
 drop(x=this.aim){
  if(!this.canDrop())return false;
  this.setAim(x);this.fruits.push(this.make(this.current,this.aim,49,0,20));
  this.credits--;this.drops++;this.lastDrop=this.time;this.current=this.next;this.next=this.randomFruit();this.setAim(this.aim);return true;
 }
 walls(f){
  if(f.x-f.r<=this.left){f.x=this.left+f.r;if(f.vx<0)f.vx=Math.abs(f.vx)>40?-f.vx*.1:0;f.contact=true;}
  if(f.x+f.r>=this.right){f.x=this.right-f.r;if(f.vx>0)f.vx=Math.abs(f.vx)>40?-f.vx*.1:0;f.contact=true;}
  if(f.y+f.r>=this.floor){
   f.y=this.floor-f.r;f.contact=true;f.supported=true;
   const impact=Math.max(0,f.vy);if(f.vy>0)f.vy=impact>40?-impact*.06:0;

function confirmSessionExit(){
 if(!sessionIsActive())return true;
 const pending=session,start=Date.now();const leave=confirm('Exit this session? You will lose your place and current session progress. Answers and exam drafts already saved to your account will be kept.');
 if(!leave&&session===pending){
  const elapsed=Date.now()-start;
  if(session.kind==='rush'){
   session.ends+=elapsed;
   if(session.advanceAt){session.advanceAt+=elapsed;clearTimeout(autoNext);autoNext=setTimeout(nextQuestion,Math.max(0,session.advanceAt-Date.now()));}
  }
  if(session.kind==='suika'){if(session.retryAt)session.retryAt+=elapsed;session.inputAfter=Math.max(Date.now()+200,(session.inputAfter||0)+elapsed);Suika.resetNavigationClock();}
 }
 return leave;
}

/* Answer outcomes use green/red; unanswered space stays neutral. */
function answerBar(correct,incorrect,total,{id='',compact=false}={}){
 correct=Math.max(0,Number(correct)||0);incorrect=Math.max(0,Number(incorrect)||0);total=Math.max(correct+incorrect,Number(total)||0);
 const green=total?100*correct/total:0,red=total?100*incorrect/total:0,unanswered=Math.max(0,total-correct-incorrect);
 return '<div class="track answer-track" '+(id?'id="'+id+'" ':'')+(compact?'style="width:90px;margin:6px 0" ':'')+'role="img" aria-label="'+correct+' correct, '+incorrect+' incorrect, '+unanswered+' unanswered"><i class="answer-correct" style="width:'+green+'%"></i><i class="answer-incorrect" style="width:'+red+'%"></i></div>';
}
function topicAnswerCounts(topics){
 let correct=0,incorrect=0,total=0;
 for(const t of topics)for(const q of t.questions){total++;const a=progress.answers[q.id];if(!a)continue;if(a.lastCorrect??a.correct)correct++;else incorrect++;}
 return {correct,incorrect,total};
}
function sessionAnswerCounts(){const results=session?.results||[];return {correct:results.filter(r=>r.correct).length,incorrect:results.filter(r=>!r.correct).length,total:session?.kind==='rush'?results.length:session?.queue?.length||0};}
function sessionAnswerBar(){const c=sessionAnswerCounts();return answerBar(c.correct,c.incorrect,c.total,{id:'session-results-track'});}
function updateSessionAnswerBar(){
 if(!session||session.kind!=='learn')return;
 const el=$('#session-results-track');if(!el)return;const c=sessionAnswerCounts(),total=Math.max(c.total,c.correct+c.incorrect);
 const green=el.querySelector?.('.answer-correct'),red=el.querySelector?.('.answer-incorrect');
 if(green)green.style.width=(total?100*c.correct/total:0)+'%';if(red)red.style.width=(total?100*c.incorrect/total:0)+'%';
 el.setAttribute('aria-label',c.correct+' correct, '+c.incorrect+' incorrect, '+Math.max(0,total-c.correct-c.incorrect)+' unanswered');
}

function retryMissed(){const queue=session.results.filter(r=>!r.correct).map(r=>({...r,options:r.options?shuffle(r.options):undefined}));session={kind:'learn',queue,index:0,results:[],phase:'question',seen:[],answered:false,choice:null};view='session';questionView();window.scrollTo(0,0);}
function examState(id){if(!progress.exams[id])progress.exams[id]={drafts:{},marks:{},revealed:false,submitted:false};return progress.exams[id];}
function examView(){let t=TOPICS.find(t=>t.id===session.topics[session.index]),ex=examState(t.id);shell(`<div class="session"><button class="back" data-nav="exam">← Back to exam topics · drafts save automatically</button><div class="session-head"><span>EXAM PRACTICE · SET ${session.index+1} OF ${session.topics.length}</span><span>${totalMarks(t)} marks</span></div><div class="track"><i style="width:${100*(session.index+1)/session.topics.length}%"></i></div><article class="panel"><span class="badge">${t.code} · Original exam-style question</span><h1 style="font-size:27px;margin:6px 0 18px">${t.title}</h1><p style="font-size:14px">${t.exam.context}</p>${t.exam.parts.map((p,i)=>`<section class="exam-part"><h3><span class="marks">[${p[1].length}]</span><b>(${String.fromCharCode(97+i)})</b> ${p[0]}</h3><label class="sr-only" for="draft-${i}">Your answer to part ${String.fromCharCode(97+i)}</label><textarea id="draft-${i}" data-draft="${i}" placeholder="Write your answer and working here…">${escapeHTML(ex.drafts[i]||'')}</textarea>${ex.revealed?`<div class="scheme"><h4 style="font-size:13px">Mark scheme · ${p[1].length} marks</h4><p>Check each point your answer earns. Each point is worth one mark.</p>${p[1].map((point,j)=>`<label class="mark-point"><input type="checkbox" data-mark="${i}-${j}" ${ex.marks[`${i}-${j}`]?'checked':''}><span>${point}</span></label>`).join('')}<div class="exam-worked"><b>Why this works</b><br>${p[2]}</div></div>`:''}</section>`).join('')}<div class="session-bottom"><span id="exam-score">${ex.revealed?`${examMarks(t)} / ${totalMarks(t)} marks self-awarded`:'Answer first, then compare with the worked solution.'}</span>${!ex.revealed?'<button class="btn" id="reveal-scheme">Reveal mark scheme →</button>':'<button class="btn" id="save-marks">Save marks & continue →</button>'}</div></article><div class="session-bottom">${session.index>0?'<button class="btn light" id="previous-exam">← Previous set</button>':'<span class="hint">Your work is saved to your account.</span>'}<button class="btn light" id="finish-early">Finish practice</button></div></div>`);}
function showProgress(){shell(`${intro('YOUR REVISION JOURNEY','See how far you’ve come.','A clear picture of your practice. Progress is saved to your account, on every device.')}<div class="stats"><div class="stat"><div><b>${overall()} / ${skillTotal()}</b><span>Question types practised successfully</span></div></div><div class="stat"><div><b>${progress.attempts}</b><span>Total quiz attempts</span></div></div><div class="stat"><div><b>${progress.rushBest}</b><span>Best rush · correct answers in one session</span></div></div></div><article class="panel"><div class="section-title"><h2>Topic by topic</h2><small>Coverage follows skills across their variants, not an exam-grade prediction</small></div><div style="overflow-x:auto"><table class="progress-table"><thead><tr><th>Topic</th><th>Latest quiz results</th><th>Latest recall</th><th>Exam marks</th></tr></thead><tbody>${TOPICS.map(t=>{const attempted=t.questions.filter(q=>progress.answers[q.id]);let latest=attempted.filter(q=>progress.answers[q.id].lastCorrect).length;return `<tr><td><button class="btn ghost" style="font-size:12px;text-align:left" data-quick="${t.id}">${t.code} ${t.title}</button></td><td>${latest} / ${t.questions.length}${(()=>{const c=topicAnswerCounts([t]);return answerBar(c.correct,c.incorrect,c.total,{compact:true});})()}</td><td>${attempted.length?`${latest} / ${attempted.length}`:'Not tried'}</td><td>${progress.exams[t.id]?.submitted?`${examMarks(t)} / ${totalMarks(t)}`:progress.exams[t.id]?'Draft':'Not tried'}</td></tr>`;}).join('')}</tbody></table></div></article><div class="settings"><span>Saved locally: quiz history, exam drafts and self-assessed marks. Clearing browser data removes this progress.</span><button class="btn light" id="reset-progress">Reset progress</button></div>`);}
function toast(text){$('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=text;d.setAttribute('role','status');document.body.append(d);setTimeout(()=>d.remove(),2400);}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){navigate(b.dataset.nav);return;}if(b.dataset.quick){selected=new Set([b.dataset.quick]);mode='learn';begin();return;}if(b.dataset.module){selected=new Set(TOPICS.filter(t=>t.module===Number(b.dataset.module)).map(t=>t.id));mode='learn';view='setup';moduleFilter=b.dataset.module;query='';stopTimers();session=null;setup();window.scrollTo(0,0);return;}if(b.dataset.answer!==undefined){answer(Number(b.dataset.answer));return;}if(b.dataset.examRevisit){selected=new Set([b.dataset.examRevisit]);mode='exam';begin();return;}
switch(b.id){case 'start':begin();break;case 'clear-selection':selected.clear();setup();break;case 'select-visible':filtered().forEach(t=>selected.add(t.id));setup();break;case 'lesson-done':session.phase='question';if(!session.seen.includes(currentQuestion().topic))session.seen.push(currentQuestion().topic);questionView();break;case 'show-lesson':session.phase='lesson';questionView();break;case 'next':nextQuestion();break;case 'finish-early':finish();break;case 'retry-missed':retryMissed();break;case 'reveal-scheme':examState(session.topics[session.index]).revealed=true;persist();examView();break;case 'save-marks':examState(session.topics[session.index]).submitted=true;persist();if(session.index===session.topics.length-1)finish();else{session.index++;examView();window.scrollTo(0,0);}break;case 'previous-exam':session.index--;examView();window.scrollTo(0,0);break;case 'reset-progress':if(confirm('Reset all quiz progress, exam drafts and marks for this lab in your account?')){progress=fresh();persist();showProgress();toast('Progress reset');}break;}});
document.addEventListener('change',e=>{let el=e.target;if(el.dataset.topic){el.checked?selected.add(el.dataset.topic):selected.delete(el.dataset.topic);updateSelection();}if(el.id==='module-filter'){moduleFilter=el.value;$('#topic-rows').innerHTML=topicRows();}if(el.id==='duration')duration=Number(el.value);if(el.dataset.mark){let t=TOPICS.find(t=>t.id===session.topics[session.index]);examState(t.id).marks[el.dataset.mark]=el.checked;persist();$('#exam-score').textContent=`${examMarks(t)} / ${totalMarks(t)} marks self-awarded`;}});
document.addEventListener('input',e=>{let el=e.target;if(el.id==='search'){query=el.value;$('#topic-rows').innerHTML=topicRows();}if(el.dataset.draft!==undefined){examState(session.topics[session.index]).drafts[el.dataset.draft]=el.value;persist();}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(view==='session'&&session?.kind==='suika'){if(/^[1-4]$/.test(e.key)){e.preventDefault();Suika.answer(Number(e.key)-1);}return;}if(view==='session'&&session?.kind!=='exam'&&session.phase!=='lesson'){if(/^[1-4]$/.test(e.key)){e.preventDefault();answer(Number(e.key)-1);}else if(e.key==='Enter'&&session.answered){e.preventDefault();nextQuestion();}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
Account.start({key:KEY,home:view==='home',merge:mergeProgress,
 beforeSignOut:()=>confirmSessionExit(),
 onSignOut:()=>{stopTimers();session=null;},
 onSync:ok=>{storageOK=ok;},
 onReady:data=>{progress={...fresh(),...(data||{})};render();}
});

function refillRushQuestions(){
 const topicIds=session.topicIds||[...new Set(session.queue.map(q=>q.topic))];
 const skills=shuffle(TOPICS.filter(t=>topicIds.includes(t.id)).flatMap(t=>questionsFor(t,'rush').map(q=>({q,topic:t.id}))));
 const last=session.queue.at(-1);if(skills.length>1&&skills[0].q.id===last?.id){const i=skills.findIndex(s=>s.q.id!==last.id);if(i>0)[skills[0],skills[i]]=[skills[i],skills[0]];}
 return skills.map(({q,topic})=>versionFor(q,topic));
}
</script></body></html>
