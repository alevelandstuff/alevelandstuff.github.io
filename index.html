/* Motion supports orientation and feedback without delaying answers. */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-soft:cubic-bezier(.2,.7,.3,1)}
html{scroll-behavior:smooth}
.main .content>.intro,.session>.panel{animation:arrive .38s var(--ease-out) backwards}
.content>.hero{animation:arrive .48s var(--ease-out) backwards}
.stat{animation:arrive .45s var(--ease-out) backwards}
.stat:nth-child(2){animation-delay:45ms}.stat:nth-child(3){animation-delay:90ms}
.mode-card,.module-card{animation:arrive .48s var(--ease-out) backwards;transition:transform .28s var(--ease-out),box-shadow .28s ease,border-color .22s ease,background .22s ease}
.mode-card:nth-child(2),.module-card:nth-child(2){animation-delay:55ms}
.mode-card:nth-child(3),.module-card:nth-child(3){animation-delay:110ms}
.module-card:nth-child(4){animation-delay:145ms}.module-card:nth-child(5){animation-delay:180ms}.module-card:nth-child(6){animation-delay:215ms}
.btn,.nav button,.back{transition:transform .2s var(--ease-out),background-color .22s ease,color .22s ease,box-shadow .22s ease,opacity .2s ease}
.btn:active:not(:disabled),.mode-card:active,.module-card:active{transform:scale(.98)}
.btn:focus-visible,.choice:focus-visible,.mode-card:focus-visible,.module-card:focus-visible{outline:3px solid #94b97b;outline-offset:4px}
.nav button.active{box-shadow:inset 3px 0 0 #8db66b}
.nav button:hover{background-color:#f1f5ed}
.topic-row{transition:background-color .25s ease,border-color .25s ease,box-shadow .25s ease,transform .25s var(--ease-out)}
.topic-row:has(input:checked){box-shadow:0 0 0 1px #8fae7940}
.topic-row input{transition:transform .2s var(--ease-out)}
.topic-row input:checked{animation:check-in .25s var(--ease-out)}
.selection-bar{transition:box-shadow .3s ease;animation:bar-arrive .35s var(--ease-out) backwards}
.selection-bar strong,.selection-bar small{animation:fade-in .2s ease backwards}
.choice{transition:background-color .24s ease,border-color .24s ease,box-shadow .24s ease,transform .24s var(--ease-out),color .24s ease;animation:choice-arrive .3s var(--ease-out) backwards}
.choice:nth-child(2){animation-delay:30ms}.choice:nth-child(3){animation-delay:60ms}.choice:nth-child(4){animation-delay:90ms}
.choice:active:not(:disabled){transform:scale(.99)}
.choice.right{box-shadow:0 0 0 1px #8bb07435}
.choice.wrong .letter{animation:gentle-shake .3s ease backwards}
.feedback{animation:feedback-arrive .32s var(--ease-out) backwards}
.scheme{animation:feedback-arrive .4s var(--ease-out) backwards}
.track>i{transition:width .4s var(--ease-soft);transform-origin:left}
.timer{transition:color .3s ease}
.timer.low{animation:time-pulse 1.4s ease-in-out infinite}
.hero-art svg{animation:orbit-float 9s ease-in-out infinite;transform-origin:center}
.hero-art circle[fill]{animation:electron-glow 4s ease-in-out infinite alternate}
.hero-art circle[fill]:nth-last-of-type(2){animation-delay:-1.3s}
.toast{animation:toast-arrive .3s var(--ease-out) backwards}
textarea{transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease}
textarea:focus{border-color:#8eae7b;box-shadow:0 0 0 3px #8eae7b20;background:#fff}
.learning-cue{margin:13px 0 18px;padding:13px 16px;border-left:3px solid #9bbb7a;border-radius:0 8px 8px 0;background:#f3f7ed;font-size:12px;line-height:1.8;color:#476044}
.learning-cue strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.1px;margin-bottom:4px;color:#678052}
.question-actions{min-height:44px}
.review-item{animation:fade-in .35s ease backwards}
@keyframes arrive{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:translateY(0)}}
@keyframes choice-arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes feedback-arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes bar-arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes check-in{0%{transform:scale(.85)}65%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes gentle-shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}65%{transform:translateX(3px)}}
@keyframes time-pulse{0%,100%{opacity:1}50%{opacity:.65}}
@keyframes orbit-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes electron-glow{from{opacity:.65}to{opacity:1}}
@keyframes toast-arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(hover:hover){.module-card:hover{transform:translateY(-3px);border-color:#a6bd94;box-shadow:0 8px 25px #1d40340b}.choice:hover:not(:disabled){transform:translateX(3px)}.topic-row:hover{border-color:#9db58a}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Typed recall uses the same feedback and reduced-motion system as MCQ. */
.answer-type{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--green);margin-bottom:12px}
.typed-label{display:block;font-size:13px;font-weight:550;margin-bottom:10px}
.typed-input{display:block;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:9px;background:#fafbf7;color:var(--ink);font:inherit;transition:border-color .2s,box-shadow .2s,background .2s}
.definition-input{min-height:140px;line-height:1.8;resize:vertical}
.typed-input:focus{border-color:#90b374;box-shadow:0 0 0 3px #90b37420;outline:0;background:white}
.typed-input.accepted{border-color:#8bb074;background:#f4f9ef}
.typed-input.needs-review{border-color:#dba39a}
.typed-input[readonly]{color:#4c5b4c;cursor:text}
.typed-controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:13px}
.typed-controls [hidden]{display:none!important}
.typed-controls .hint{max-width:65%}
.typed-error{font-size:12px;color:var(--red);margin-top:8px}
.typed-error:empty{display:none}
.model-definition{padding:14px 16px;background:#ffffff80;border-radius:8px;margin:13px 0}
.model-definition>span{display:block;letter-spacing:1.3px;font-size:9px;font-weight:700;color:var(--muted);margin-bottom:6px}
.model-definition p{font-size:14px;line-height:1.75}
.definition-points{padding:0;list-style:none;margin:14px 0}
.definition-points li{display:flex;gap:9px;margin:7px 0;font-size:12px;line-height:1.6}
.definition-points li>span{width:16px;flex-shrink:0}
.definition-points .matched{color:#456c34}
.definition-points .missing{color:#9c4a40}
.typed-review{border-top:1px solid #d4d9ca;padding-top:16px;margin-top:12px}
.typed-review>.hint{margin-top:5px}

],{context:'A velocity–time graph has a best-fit gradient of 2.40 m s⁻². The steepest acceptable gradient is 2.65 m s⁻² and the shallowest is 2.15 m s⁻².',parts:[['Estimate the absolute and percentage uncertainties in the acceleration.',['Absolute uncertainty = (2.65 − 2.15)/2 = 0.25 m s⁻².','Percentage uncertainty = 0.25/2.40 × 100 = 10.4%, approximately 10%.'],'Report a = (2.40 ± 0.25) m s⁻², or with suitably consistent rounding.'],['All velocity readings have the same positive zero offset. Explain its effect on gradient and intercept.',['The line shifts vertically so its intercept increases.','The gradient is unchanged because differences in velocity are unchanged.'],'A constant offset cancels when taking Δv.']]});
topic('units',2,'2.1','Quantities & units',[
'SI base quantities include length (m), mass (kg), time (s), current (A) and thermodynamic temperature (K). Derived units combine base units.',
'An equation must have the same dimensions on both sides. Prefixes change scale: milli = 10⁻³, micro = 10⁻⁶, nano = 10⁻⁹ and kilo = 10³.'
],'1 N = 1 kg m s⁻²; 1 J = 1 kg m² s⁻²',[
['Which is the SI base unit of mass?',['kg','g','N','J'],'The kilogram, not the gram, is the SI base unit of mass.'],
['What is 250 μA in amperes?',['2.50 × 10⁻⁴ A','2.50 × 10⁻⁶ A','0.250 A','250 × 10⁶ A'],'Micro means 10⁻⁶, so 250 μA = 250 × 10⁻⁶ A = 2.50 × 10⁻⁴ A.'],
['What are the base units of pressure?',['kg m⁻¹ s⁻²','kg m s⁻²','kg m² s⁻²','kg m⁻² s⁻¹'],'Pressure = force/area, so its units are kg m s⁻² / m² = kg m⁻¹ s⁻².'],
['Which expression has units of energy?',['Force × distance','Force / distance','Mass × velocity','Power × frequency'],'Work = force × distance in the force direction. N m = J.']
],{context:'The drag force on a sphere is modelled by F = 6πηrv, where r is radius and v is speed.',parts:[['Determine the SI base units of η.',['Rearrange: η = F/(6πrv).','Units = (kg m s⁻²)/(m × m s⁻¹) = kg m⁻¹ s⁻¹.'],'6π is dimensionless.'],['Convert a radius of 0.35 mm to metres and calculate η for F = 1.98 × 10⁻⁵ N and v = 0.010 m s⁻¹.',['r = 3.5 × 10⁻⁴ m.','η = 1.98 × 10⁻⁵ /(6π × 3.5 × 10⁻⁴ × 0.010).','η = 0.30 kg m⁻¹ s⁻¹ to 2 significant figures.'],'Carry full calculator precision until the final answer.']]});
topic('uncertainty',2,'2.2','Measurements & uncertainty',[
'Absolute uncertainty has the same unit as the measurement. Percentage uncertainty is absolute uncertainty divided by the measured value, multiplied by 100.',
'When adding or subtracting quantities, add their absolute uncertainties. For multiplication or division, add percentage uncertainties. For a power, multiply the percentage uncertainty by the magnitude of the power.'
],'% uncertainty = (absolute uncertainty / value) × 100',[
['A length is (50.0 ± 0.5) mm. What is its percentage uncertainty?',['1.0%','0.1%','10%','2.5%'],'0.5/50.0 × 100 = 1.0%.'],
['Length has 2% uncertainty. What is the uncertainty in length squared?',['4%','2%','1%','0.04%'],'For a squared quantity, double its percentage uncertainty.'],
['For density = mass/volume, how do percentage uncertainties combine?',['Add the mass and volume percentage uncertainties','Subtract them','Multiply them','Use only the larger one'],'For a quotient, add percentage uncertainties to estimate the maximum fractional uncertainty.'],
['How can you reduce the fractional timing uncertainty for a pendulum?',['Time multiple complete oscillations and find the mean period','Time half an oscillation','Use a larger stopwatch display','Round every reading to a whole second'],'Timing many oscillations makes reaction-time uncertainty a smaller fraction of the measured interval.']
],{context:'A wire has diameter d = (0.50 ± 0.01) mm. Its cross-sectional area is A = πd²/4.',parts:[['Calculate A in m² and its percentage uncertainty.',['d = 5.0 × 10⁻⁴ m.','A = π(5.0 × 10⁻⁴)²/4 = 1.96 × 10⁻⁷ m².','Percentage uncertainty in d = 2%, so in A it is 4%.'],'To 2 significant figures A = 2.0 × 10⁻⁷ m².'],['Explain why measuring the diameter at several positions is useful.',['It detects variation in diameter along the wire.','The spread allows an estimate of uncertainty and a mean gives a more representative diameter.'],'Repeating at one place alone would not detect an uneven wire.']]});
topic('vectors',2,'2.3','Scalars & vectors',[
'A scalar has magnitude only. A vector has magnitude and direction. Distance, speed, energy and mass are scalars. Displacement, velocity, acceleration and force are vectors.',
'Add vectors tip to tail or by resolving into perpendicular components. If θ is measured from the horizontal, horizontal component = F cos θ and vertical component = F sin θ.'
],'R = √(Fx² + Fy²)',[
['Which quantity is a vector?',['Momentum','Kinetic energy','Temperature','Power'],'Momentum has direction: p = mv. Energy, temperature and power are scalars.'],
['A 10 N force acts at 30° above the horizontal. Its vertical component is…',['5.0 N','8.7 N','10 N','20 N'],'The vertical component is 10 sin 30° = 5.0 N.'],
['Two perpendicular forces are 3 N and 4 N. What is their resultant magnitude?',['5 N','7 N','1 N','12 N'],'Pythagoras gives √(3² + 4²) = 5 N.'],
['An object completes a circle and returns to its start. Its displacement is…',['Zero','The circumference','The diameter','The radius'],'Displacement is the vector from initial to final position. These positions coincide.']
],{context:'A cable pulls a crate with a force of 80 N at 35° above the horizontal. The crate moves 6.0 m horizontally at constant speed.',parts:[['Calculate the horizontal and vertical components of the tension.',['Horizontal = 80 cos 35° = 65.5 N.','Vertical = 80 sin 35° = 45.9 N.'],'To 2 significant figures: 66 N horizontal and 46 N vertical.'],['Calculate the work done by the cable and state the horizontal friction force.',['W = 80 × 6.0 × cos 35° = 393 J, approximately 390 J.','Constant velocity implies zero resultant force, so friction = 65.5 N in the opposite direction.'],'The vertical tension does no work because there is no vertical displacement.']]});
topic('motion',3,'3.1','Motion',[
'Velocity is the rate of change of displacement. Acceleration is the rate of change of velocity. The gradient of a displacement–time graph is velocity; the area under a velocity–time graph is displacement.',
'Use the constant-acceleration equations only when acceleration is constant. For a projectile with negligible air resistance, horizontal velocity stays constant while vertical acceleration is g downwards.'
],'v = u + at; s = ut + ½at²; v² = u² + 2as',[
['What does the area under a velocity–time graph represent?',['Displacement','Acceleration','Force','Distance in every case'],'Signed area gives displacement. Distance is the area under a speed–time graph, or the sum of absolute v–t areas.'],
['A car accelerates from 4 m s⁻¹ at 3 m s⁻² for 2 s. Find v.',['10 m s⁻¹','6 m s⁻¹','14 m s⁻¹','2 m s⁻¹'],'v = u + at = 4 + 3 × 2 = 10 m s⁻¹.'],
['A projectile moves without air resistance. Which quantity remains constant?',['Horizontal velocity','Vertical velocity','Speed','Vertical displacement'],'There is no horizontal resultant force, so horizontal acceleration is zero.'],
['A ball is dropped from rest. After 2.0 s, how far has it fallen? Use g = 9.81 m s⁻².',['19.6 m','9.81 m','39.2 m','4.91 m'],'s = ½gt² = 0.5 × 9.81 × 2² = 19.6 m.']
],{context:'A ball is projected horizontally at 12 m s⁻¹ from a platform 20 m above level ground. Neglect air resistance and use g = 9.81 m s⁻².',parts:[['Calculate the time to hit the ground and the horizontal distance travelled.',['Vertically: 20 = ½ × 9.81 × t².','t = 2.02 s.','Horizontal distance = 12 × 2.02 = 24.2 m.'],'Horizontal and vertical motion are independent but share the same time.'],['Calculate the speed just before impact.',['Vertical speed = 9.81 × 2.02 = 19.8 m s⁻¹.','Resultant speed = √(12² + 19.8²) = 23.2 m s⁻¹.'],'Speed combines perpendicular velocity components; do not add their magnitudes.']]});
topic('forces',3,'3.2','Forces in action',[
'For equilibrium, resultant force and resultant moment must both be zero. A moment is force multiplied by perpendicular distance from the pivot to the force’s line of action.',
'Pressure = force/area. In a fluid, pressure difference = ρgh. Upthrust is the weight of displaced fluid. A falling object reaches terminal speed when drag plus upthrust balances weight.'
],'Moment = Fd⊥; Δp = ρgh',[
['A 20 N force acts 0.30 m perpendicularly from a pivot. What is its moment?',['6.0 N m','66.7 N m','0.015 N m','20.3 N m'],'Moment = force × perpendicular distance = 20 × 0.30 = 6.0 N m.'],
['An object falls at terminal velocity. Its resultant force is…',['Zero','Equal to its weight','Increasing','Equal to drag only'],'Constant velocity means zero acceleration, so the resultant force is zero.'],
['The upthrust on an immersed object equals…',['The weight of fluid displaced','The object’s mass','The object’s weight in every case','The fluid pressure at its top'],'Archimedes’ principle relates upthrust to the weight of the displaced fluid.'],
['What is needed for a rigid body to be in equilibrium?',['Zero resultant force and moment','Zero resultant force only','Equal mass on each side','No forces acting'],'Translational and rotational equilibrium are both required.']
],{context:'A uniform horizontal beam is 4.0 m long and weighs 200 N. It is hinged at the left end. A vertical cable at the right end supports it. A 300 N load acts 1.0 m from the hinge.',parts:[['Calculate the cable tension by taking moments about the hinge.',['Beam weight acts at its centre, 2.0 m from the hinge.','T × 4.0 = 200 × 2.0 + 300 × 1.0.','T = 175 N.'],'Taking moments at the hinge removes the unknown hinge reaction.'],['Calculate the vertical force exerted by the hinge on the beam.',['Vertical equilibrium: R + 175 = 200 + 300.','R = 325 N upwards.'],'There are no horizontal loads in this model.']]});
topic('energy',3,'3.3','Work, energy & power',[
'Work is the energy transferred when a force moves its point of application: W = Fs cos θ. Kinetic energy = ½mv². Near Earth, a change in gravitational potential energy is mgΔh.',
'Power is the rate of energy transfer. Efficiency = useful output energy/total input energy. Mechanical energy is conserved when only conservative forces do work; friction transfers energy to internal stores.'
],'Ek = ½mv²; P = E/t = Fv (parallel force)',[
['If speed doubles, kinetic energy becomes…',['Four times as large','Twice as large','Half as large','Unchanged'],'Kinetic energy is proportional to v², so doubling v multiplies it by 4.'],
['A 50 W device operates for 20 s. How much energy is transferred?',['1000 J','2.5 J','70 J','0.40 J'],'E = Pt = 50 × 20 = 1000 J.'],
['A machine receives 500 J and produces 350 J of useful energy. Its efficiency is…',['70%','143%','30%','150%'],'Efficiency = 350/500 = 0.70 = 70%.'],
['A force acts perpendicular to displacement. How much work does it do?',['Zero','Fs','F/s','Fs²'],'W = Fs cos 90° = 0. This applies to centripetal force in uniform circular motion.']
],{context:'An electric motor lifts a 50 kg load vertically through 8.0 m in 12 s at constant speed. The motor is 75% efficient. Use g = 9.81 m s⁻².',parts:[['Calculate the useful energy transferred and useful power.',['Useful energy = mgh = 50 × 9.81 × 8.0 = 3924 J.','Useful power = 3924/12 = 327 W.'],'Constant speed means no change in kinetic energy.'],['Calculate the electrical input power and wasted energy during the lift.',['Input power = 327/0.75 = 436 W.','Input energy = 3924/0.75 = 5232 J.','Wasted energy = 5232 − 3924 = 1308 J.'],'Efficiency uses useful output divided by total input.']]});
topic('materials',3,'3.4','Materials',[
'Stress is tensile force divided by cross-sectional area. Strain is extension divided by original length and has no unit. Young modulus = stress/strain within the linear elastic region.',
'Hooke’s law F = kx applies up to the limit of proportionality. Elastic deformation is reversed when the force is removed; plastic deformation leaves a permanent extension. The area under a force–extension graph is the work done.'
],'σ = F/A; ε = ΔL/L; E = FL/(AΔL)',[
['What is the unit of strain?',['No unit','Pa','N m⁻¹','m'],'Strain is a ratio of two lengths, so it is dimensionless.'],
['What is the gradient of a stress–strain graph in the linear region?',['Young modulus','Spring constant','Density','Elastic energy'],'Young modulus = stress/strain, the gradient of the linear stress–strain graph.'],
['A spring has k = 200 N m⁻¹ and extension 0.050 m. Find its elastic energy.',['0.25 J','0.50 J','10 J','5.0 J'],'Elastic energy = ½kx² = 0.5 × 200 × 0.050² = 0.25 J.'],
['Which deformation leaves a permanent change when the load is removed?',['Plastic','Elastic','Proportional only','Any small strain'],'Plastic deformation is not fully reversed after unloading.']
],{context:'A wire of length 2.0 m and diameter 0.40 mm extends by 1.5 mm under a force of 20 N. It remains in the linear elastic region.',parts:[['Calculate the stress and strain.',['Area = π(0.20 × 10⁻³)² = 1.26 × 10⁻⁷ m².','Stress = 20/(1.26 × 10⁻⁷) = 1.59 × 10⁸ Pa.','Strain = 1.5 × 10⁻³/2.0 = 7.5 × 10⁻⁴.'],'Use radius = diameter/2 when finding area.'],['Calculate Young modulus and the elastic energy stored.',['E = stress/strain = 2.12 × 10¹¹ Pa.','Energy = ½FΔL = 0.5 × 20 × 1.5 × 10⁻³ = 0.015 J.'],'The energy is the triangular area under the force–extension graph.']]});
topic('momentum',3,'3.5','Newton’s laws & momentum',[
'Newton’s second law states that resultant force is the rate of change of momentum. For constant mass this becomes F = ma. Momentum p = mv is a vector.',
'Momentum is conserved in an isolated system with no resultant external force. Kinetic energy is also conserved in elastic collisions, but not in inelastic ones. An impulse equals the change in momentum.'
],'F = Δp/Δt; impulse = FΔt',[
['What is always conserved in a collision with negligible external resultant force?',['Total momentum','Total kinetic energy','Each object’s velocity','Each object’s momentum'],'The total system momentum is conserved. Kinetic energy is conserved only in an elastic collision.'],
['A 2 kg trolley moves at 3 m s⁻¹. What is its momentum?',['6 kg m s⁻¹','1.5 kg m s⁻¹','9 kg m s⁻¹','5 kg m s⁻¹'],'p = mv = 2 × 3 = 6 kg m s⁻¹ in the velocity direction.'],
['For the same momentum change, increasing the stopping time makes the mean force…',['Smaller','Larger','Unchanged','Zero in all cases'],'Mean force = change in momentum / time. A longer stopping time reduces the mean force.'],
['Newton’s third-law force pair acts…',['On different objects','On the same object','Only on stationary objects','Only when accelerations are equal'],'The two forces are equal and opposite, of the same interaction type, and act on different objects.']
],{context:'A 0.20 kg ball strikes a vertical wall horizontally at 15 m s⁻¹ and rebounds at 10 m s⁻¹. Contact lasts 0.025 s.',parts:[['Calculate the change in momentum and the mean force on the ball.',['Taking towards the wall as positive: Δp = 0.20 × (−10 − 15).','Δp = −5.0 kg m s⁻¹.','Mean force = −5.0/0.025 = −200 N, or 200 N away from the wall.'],'Rebound velocity has the opposite sign to the initial velocity.'],['Determine whether the collision is elastic.',['Initial kinetic energy = ½ × 0.20 × 15² = 22.5 J.','Final kinetic energy = ½ × 0.20 × 10² = 10 J, so kinetic energy is not conserved and the collision is inelastic.'],'The lost kinetic energy is transferred to other stores, including internal energy.']]});
topic('current',4,'4.1','Charge & current',[
'Electric current is the rate of flow of charge. Conventional current is defined as the direction of positive charge flow; electrons in a metal drift in the opposite direction.',
'In a conductor, I = nAev, where n is the number of mobile charge carriers per unit volume, A is cross-sectional area, e is the magnitude of charge per electron and v is mean drift speed.'
],'I = ΔQ/Δt; I = nAev',[
['A current of 0.50 A flows for 3.0 min. Find the charge.',['90 C','1.5 C','360 C','0.167 C'],'Convert 3.0 min to 180 s. Q = It = 0.50 × 180 = 90 C.'],
['In a metal, electron drift is…',['Opposite to conventional current','In the conventional-current direction','At the speed of light','Random with no net drift when current flows'],'Electrons are negatively charged, so their net drift is opposite to positive-charge flow.'],
['In I = nAev, what is n?',['Charge-carrier number per unit volume','Total number of electrons','Number of protons per atom','Charge per particle'],'Number density n has unit m⁻³.'],
['For fixed current and material, doubling wire area makes drift speed…',['Half as large','Twice as large','Four times as large','Unchanged'],'v = I/(nAe), so v is inversely proportional to area.']
],{context:'A metal wire has cross-sectional area 1.0 × 10⁻⁶ m² and mobile electron number density 8.5 × 10²⁸ m⁻³. It carries a current of 2.0 A. Use e = 1.60 × 10⁻¹⁹ C.',parts:[['Calculate the electron drift speed.',['Use v = I/(nAe).','v = 2.0/(8.5 × 10²⁸ × 1.0 × 10⁻⁶ × 1.60 × 10⁻¹⁹).','v = 1.47 × 10⁻⁴ m s⁻¹.'],'The drift speed is much smaller than the speed at which an electrical signal propagates.'],['Calculate the number of electrons passing a point in 30 s.',['Q = It = 60 C.','N = Q/e = 3.75 × 10²⁰ electrons.'],'Count charge passing a cross-section, not all electrons in the wire.']]});
topic('resistance',4,'4.2','Energy, power & resistance',[
'Potential difference is energy transferred per unit charge. Resistance is V/I. For an ohmic conductor at constant temperature, current is proportional to potential difference.',
'Resistivity is a material property: R = ρL/A. Metal resistance usually increases as temperature rises because lattice vibrations increase, making electron motion more difficult. Electrical power is VI.'
],'V = W/Q; R = ρL/A; P = VI = I²R',[
['A p.d. of 6 V transfers how much energy per coulomb?',['6 J','1/6 J','36 J','6 W'],'1 V = 1 J C⁻¹, so 6 V means 6 J transferred per coulomb.'],
['Wire length doubles while area and temperature stay fixed. Its resistance…',['Doubles','Halves','Quadruples','Stays the same'],'R = ρL/A, so resistance is directly proportional to length.'],
['A 12 Ω resistor carries 0.50 A. What power is dissipated?',['3.0 W','6.0 W','24 W','0.25 W'],'P = I²R = 0.50² × 12 = 3.0 W.'],
['Why does a filament lamp’s resistance rise when it heats up?',['Increased lattice vibrations increase electron scattering','Electrons gain mass','Its charge disappears','Its current becomes negative'],'Higher lattice vibration increases the rate of electron scattering in the metal.']
],{context:'A wire of resistivity 1.1 × 10⁻⁶ Ω m, length 2.0 m and cross-sectional area 0.20 mm² is connected across 6.0 V. Assume temperature is constant.',parts:[['Calculate the resistance and current.',['Area = 2.0 × 10⁻⁷ m².','R = ρL/A = 11 Ω.','I = V/R = 0.545 A.'],'A square millimetre is 10⁻⁶ m², so 0.20 mm² = 2.0 × 10⁻⁷ m².'],['Calculate energy transferred in 60 s and explain why the constant-temperature assumption may fail.',['Energy = VIt = 6.0 × 0.545 × 60 = 196 J.','The wire may heat up, changing its resistivity and hence its resistance/current.'],'For an ordinary metal, a rise in temperature generally increases resistance.']]});
topic('circuits',4,'4.3','Electrical circuits',[
'Kirchhoff’s first law expresses charge conservation: total current entering a junction equals total current leaving. The second law expresses energy conservation around a closed loop.',
'A source has emf ε (energy supplied per unit charge) and internal resistance r. Its terminal p.d. is V = ε − Ir. In a potential divider, voltage is divided in proportion to resistance.'
],'V = ε − Ir; Vout = Vin R₂/(R₁ + R₂)',[
['Two resistors of 6 Ω and 3 Ω are in parallel. Find the total resistance.',['2 Ω','9 Ω','3 Ω','18 Ω'],'1/R = 1/6 + 1/3 = 1/2, so R = 2 Ω.'],
['A cell has ε = 1.5 V and r = 0.20 Ω. At I = 1.0 A, its terminal p.d. is…',['1.3 V','1.7 V','0.30 V','7.5 V'],'V = ε − Ir = 1.5 − 1.0 × 0.20 = 1.3 V.'],
['Kirchhoff’s junction law is based on conservation of…',['Charge','Momentum','Mass only','Resistance'],'Charge does not accumulate at a steady-state junction, so current in equals current out.'],
['Equal resistors form a divider across 10 V. What is the p.d. across one resistor?',['5 V','10 V','20 V','2 V'],'Equal series resistances share the input p.d. equally.']
],{context:'A cell of emf 12 V and internal resistance 0.50 Ω is connected to a 5.5 Ω resistor.',parts:[['Calculate current and terminal p.d.',['Total resistance = 5.5 + 0.50 = 6.0 Ω.','I = 12/6.0 = 2.0 A.','Terminal p.d. = 12 − 2.0 × 0.50 = 11 V.'],'The external resistor receives 11 V, with 1.0 V across the internal resistance.'],['Calculate power delivered to the external resistor and power dissipated inside the cell.',['External power = I²R = 2.0² × 5.5 = 22 W.','Internal power = I²r = 2.0² × 0.50 = 2.0 W.'],'Total power supplied is εI = 24 W.']]});
topic('waves',4,'4.4','Waves',[
'A progressive wave transfers energy without net transfer of matter. Wave speed = frequency × wavelength. Transverse oscillations are perpendicular to propagation; longitudinal oscillations are parallel.',
'Coherent sources have a constant phase difference and the same frequency. Constructive interference occurs for path difference nλ; destructive interference for (n + ½)λ. A stationary wave has fixed nodes and antinodes.'
],'v = fλ; double-slit spacing w = λD/a',[
['Which property changes when light enters glass from air?',['Wavelength','Frequency','Period','Photon energy'],'Frequency is set by the source and remains constant. Lower speed in glass means shorter wavelength.'],
['What is the separation of adjacent nodes on a stationary wave?',['λ/2','λ','λ/4','2λ'],'Adjacent nodes are half a wavelength apart; a node and adjacent antinode are λ/4 apart.'],
['Two coherent waves arrive in antiphase with equal amplitude. The result is…',['Complete destructive interference','Double amplitude','Double frequency','A higher wave speed'],'Equal and opposite displacements cancel at that point.'],
['A wave has f = 50 Hz and λ = 0.40 m. Its speed is…',['20 m s⁻¹','125 m s⁻¹','0.008 m s⁻¹','50.4 m s⁻¹'],'v = fλ = 50 × 0.40 = 20 m s⁻¹.']
],{context:'In a double-slit experiment, slit separation is 0.30 mm and the screen is 2.0 m away. Monochromatic light has wavelength 600 nm.',parts:[['Calculate the separation of adjacent bright fringes.',['Use w = λD/a.','w = (600 × 10⁻⁹ × 2.0)/(0.30 × 10⁻³) = 4.0 × 10⁻³ m.','Fringe spacing = 4.0 mm.'],'The small-angle approximation is appropriate here.'],['Explain the effect on the pattern of doubling slit separation.',['Fringe spacing halves to 2.0 mm because w is inversely proportional to a.','Bright fringes still occur where the path difference is an integer number of wavelengths.'],'A constant phase relationship is required for a stable pattern.']]});
topic('quantum',4,'4.5','Quantum physics',[
'Light exchanges energy in photons, each with E = hf = hc/λ. In the photoelectric effect, one photon transfers its energy to one electron. Energy must first overcome the metal’s work function φ.',
'Above threshold frequency, maximum photoelectron kinetic energy depends on frequency, not intensity. More intensity at fixed frequency above threshold means more photons per second, so a larger photoelectric current. Matter has de Broglie wavelength h/p.'
],'hf = φ + KEmax; λ = h/p',[
['Increasing intensity at fixed frequency above threshold increases…',['Photoelectric current','Maximum electron kinetic energy','Threshold frequency','Energy per photon'],'More photons per second can release more electrons per second, without changing energy per photon.'],
['Below threshold frequency, raising intensity causes…',['No photoelectron emission in the standard single-photon model','Immediate emission at any intensity','A higher photon energy','A lower work function'],'Each photon still has insufficient energy to overcome the work function.'],
['If a particle’s momentum doubles, its de Broglie wavelength…',['Halves','Doubles','Quadruples','Stays the same'],'λ = h/p, so wavelength is inversely proportional to momentum.'],
['The work function is…',['The minimum energy to free an electron from the metal surface','The energy of every emitted electron','The number of photons per second','The maximum photon energy'],'The remainder of the absorbed photon energy becomes electron kinetic energy.']
],{context:'Light of frequency 8.0 × 10¹⁴ Hz illuminates a metal of work function 2.0 eV. Use h = 6.63 × 10⁻³⁴ J s and 1 eV = 1.60 × 10⁻¹⁹ J.',parts:[['Calculate the maximum photoelectron kinetic energy in joules.',['Photon energy = hf = 5.304 × 10⁻¹⁹ J.','Work function = 3.20 × 10⁻¹⁹ J.','KEmax = 2.10 × 10⁻¹⁹ J.'],'Use the same energy units throughout.'],['Calculate the stopping potential and explain why it is unchanged if intensity doubles.',['Vs = KEmax/e = 1.32 V.','At fixed frequency, photon energy is unchanged, so maximum electron kinetic energy and stopping potential stay the same.'],'The photocurrent may increase, but the maximum energy does not.']]});
topic('thermal',5,'5.1','Thermal physics',[
'Internal energy is the sum of the random kinetic and potential energies of the particles in a system. Temperature is related to mean random kinetic energy. Heating transfers energy because of a temperature difference.',
'For an ideal gas, pV = nRT = NkT, using kelvin. Mean molecular translational kinetic energy = 3kT/2. Use ΔU = Q + W when W is work done on the system; work done by the gas has the opposite sign.',
'Specific heat capacity relates energy to a temperature change: Q = mcΔT. During a change of state, Q = mL; temperature stays constant while potential energy changes.'
],'pV = nRT; Q = mcΔT; ½m⟨c²⟩ = ³⁄₂kT',[
['A fixed mass of ideal gas is heated at constant volume from 27°C to 127°C. The pressure ratio p₂/p₁ is…',['4/3','127/27','2','3/4'],'Use kelvin: T₁ ≈ 300 K and T₂ ≈ 400 K. At constant V, p ∝ T, so ratio = 400/300 = 4/3.'],
['For an ideal gas, doubling absolute temperature makes r.m.s. speed…',['√2 times as large','Twice as large','Four times as large','Half as large'],'Mean squared speed is proportional to T, so r.m.s. speed is proportional to √T.'],
['While a pure solid melts at constant temperature, the energy supplied mainly increases…',['Particle potential energy','Mean random kinetic energy','Temperature','Total mass'],'Particles separate/rearrange against attractive forces while their mean kinetic energy remains constant.'],
['A gas receives 500 J of heating and does 200 J of work. What is ΔU?',['+300 J','+700 J','−300 J','−700 J'],'ΔU = Q − work done by gas = 500 − 200 = 300 J.']
],{context:'A sealed container holds 0.20 mol of ideal gas in a fixed volume of 2.0 × 10⁻³ m³. Its temperature rises from 300 K to 450 K. Use R = 8.31 J mol⁻¹ K⁻¹.',parts:[['Calculate the initial and final pressures.',['p₁ = nRT₁/V = 0.20 × 8.31 × 300 /(2.0 × 10⁻³).','p₁ = 2.49 × 10⁵ Pa.','p₂ = p₁ × 450/300 = 3.74 × 10⁵ Pa.'],'Pressure is proportional to absolute temperature at fixed volume and amount.'],['Explain the pressure rise in terms of molecules.',['Higher temperature means higher mean random kinetic energy and greater molecular speeds.','Molecules collide with the walls more frequently.','Each collision has a greater average momentum change, so the rate of momentum transfer and pressure increase.'],'Relate pressure to force per area and force to rate of momentum transfer.'],['The gas absorbs 374 J. Determine its internal energy increase.',['The rigid container has no volume change, so the gas does no pressure–volume work.','ΔU = Q = +374 J.'],'Use the specified work sign convention.']]});
topic('circular',5,'5.2','Circular motion',[
'In uniform circular motion, speed stays constant but velocity changes direction. Acceleration is towards the centre. A resultant inward force is required; “centripetal” describes its role, not an extra type of force.',

],'v = ωr; a = v²/r = ω²r; F = mv²/r',[
['Centripetal acceleration points…',['Towards the centre','Along the velocity','Away from the centre','Opposite to motion'],'Velocity changes towards the centre even when its magnitude is constant.'],
['Speed doubles at the same radius. Centripetal force becomes…',['Four times as large','Twice as large','Half as large','Unchanged'],'F = mv²/r, so it scales with the square of speed.'],
['An object makes 2 revolutions per second. What is ω?',['4π rad s⁻¹','2 rad s⁻¹','π rad s⁻¹','1/2 rad s⁻¹'],'ω = 2πf = 4π rad s⁻¹.'],
['Why does centripetal force do no work in uniform circular motion?',['It is perpendicular to instantaneous velocity','There is no force','There is no displacement at any instant','Acceleration is zero'],'The force is perpendicular to each small displacement, so F · ds = 0.']
],{context:'A 0.40 kg object moves at constant speed in a horizontal circle of radius 0.80 m. It makes one revolution in 1.2 s. A horizontal tension provides the resultant force.',parts:[['Calculate speed and centripetal force.',['v = 2πr/T = 2π × 0.80/1.2 = 4.19 m s⁻¹.','F = mv²/r = 0.40 × 4.19²/0.80.','F = 8.77 N.'],'The force is towards the centre.'],['Explain why velocity changes while kinetic energy is constant.',['Velocity is a vector and its direction changes continuously.','Speed is constant, so ½mv² remains constant.'],'Nonzero acceleration need not change kinetic energy.']]});
topic('oscillations',5,'5.3','Oscillations',[
'Simple harmonic motion has acceleration proportional to displacement from equilibrium and directed towards equilibrium: a = −ω²x.',

],'a = −ω²x; T = 2π/ω; vmax = ωA',[
['Which condition defines SHM?',['a ∝ −x','a ∝ v','a is constant','v ∝ x²'],'The minus sign indicates acceleration towards equilibrium, opposite to displacement.'],
['At maximum displacement in SHM, speed is…',['Zero','Maximum','Equal to ω','Constant and nonzero'],'The oscillator reverses direction at an extreme, so its instantaneous speed is zero.'],
['Resonance occurs when driving frequency is close to…',['The natural frequency','Zero frequency','Twice every possible frequency','The inverse amplitude'],'Energy transfer is most effective near the natural frequency, producing a large steady-state amplitude.'],

topic('gravity',5,'5.4','Gravitational fields',[

],'g = GM/r²; V = −GM/r; vorbit = √(GM/r)',[
['At twice the distance from a point mass, field strength is…',['One quarter','One half','Twice as large','Unchanged'],'g ∝ 1/r², so g at 2r is g/4.'],
['Why is gravitational potential negative with zero at infinity?',['Energy must be supplied to move a mass to infinity','Gravity repels masses','Mass is negative','Field strength is always zero'],'A mass at a finite distance is in a bound state with lower potential energy than at infinity.'],
['The unit of gravitational potential is…',['J kg⁻¹','N kg⁻¹','J m⁻¹','N m⁻²'],'Potential is energy per unit mass. Field strength has unit N kg⁻¹.'],
['A satellite in a larger circular orbit around the same planet has…',['Lower orbital speed','Higher orbital speed','The same orbital speed','No gravitational force'],'v = √(GM/r), so greater orbital radius means lower speed.']

topic('astro',5,'5.5','Astrophysics & cosmology',[

['A star has parallax 0.20 arcseconds. Its distance is…',['5.0 pc','0.20 pc','20 pc','0.050 pc'],'d(pc) = 1/p(arcseconds) = 1/0.20 = 5.0 pc.'],
['A hotter black body has a peak wavelength that is…',['Shorter','Longer','Unchanged','Always in the visible band'],'Wien’s law gives λmax ∝ 1/T.'],

topic('nuclear',6,'6.4','Nuclear & particle physics',[

/* A question family is one learning objective. Each visit selects a new version
   within that family; coverage and saved progress stay attached to the skill. */
const findTopic=id=>TOPICS.find(t=>t.id===id);
function variants(id,items){items.forEach((v,i)=>{const q=findTopic(id).questions[i];q.versions=[{prompt:q.prompt,options:q.options,answer:q.answer,explain:q.explain},{prompt:v[0],options:v[1],answer:v[1][0],explain:v[2]}];});}

let variantRng=null;
const pick=(n,a,offset=0)=>variantRng?a[Math.floor(variantRng()*a.length)]:a[((n+offset)%a.length+a.length)%a.length];
const fmt=n=>{if(Math.abs(n)>0&&(Math.abs(n)<0.01||Math.abs(n)>=1e5))return n.toExponential(2).replace('e+',' × 10^').replace('e',' × 10^');return String(Number(n.toPrecision(3)));};
function numerical(prompt,value,unit,explain,wrong=[]){const correct=fmt(value)+(unit?' '+unit:'');let options=[correct];for(const n of [...wrong,value*2,value/2,value*10,value/10,value*4,value/4,value+1]){const s=fmt(n)+(unit?' '+unit:'');if(!options.includes(s)&&Number.isFinite(n))options.push(s);if(options.length===4)break;}return {prompt,answer:correct,options,explain};}
function addCalc(id,skill,learn,make){const t=findTopic(id),base=make(0);t.questions.push({...base,id:id+'-'+skill,learn,make});}
function addConcept(id,skill,learn,versions){const t=findTopic(id),vs=versions.map(v=>({prompt:v[0],options:v[1],answer:v[1][0],explain:v[2]}));t.questions.push({...vs[0],id:id+'-'+skill,learn,versions:vs});}

N('current','electron-count','Charge is quantised: a number N of electrons carries charge magnitude Ne.',n=>{let q=pick(n,[.16,.32,.48,.64]);return numerical(`A charge magnitude of ${q} C passes through a wire. How many electrons is this? Use e = 1.60 × 10⁻¹⁹ C.`,q/1.6e-19,'electrons',`N = Q/e = ${q}/(1.60 × 10⁻¹⁹) = ${fmt(q/1.6e-19)} electrons.`);});

N('thermal','heat-capacity','Heating without a phase change: Q = mcΔT. A kelvin temperature interval equals a Celsius interval.',n=>{let m=pick(n,[.2,.3,.4,.5]),dt=pick(n,[10,15,20]),c=4200;return numerical(`Water of mass ${m} kg warms by ${dt}°C. Use c = 4200 J kg⁻¹ K⁻¹. Find energy supplied if losses are negligible.`,m*c*dt,'J',`Q = mcΔT = ${m} × 4200 × ${dt} = ${fmt(m*c*dt)} J. Do not add 273 to a temperature change.`);});

// Skills added above include their own short teaching cue, shown before recall.
// Original IDs are retained so progress from the first version still counts.

/* Learn-only typed recall. Key-idea checks are transparent and reviewable. */
function define(topicId,id,term,model,points){
 const versions=['Define '+term+'.','What is meant by '+term+'? Write its definition.'].map(prompt=>({type:'definition',prompt,answer:model,keyPoints:points.map(([text,...patterns])=>({text,patterns})),explain:'Compare your wording with the model definition and its key ideas.'}));
 findTopic(topicId).questions.push({...versions[0],id:topicId+'-def-'+id,versions});
}
function gap(topicId,id,prompts,answer,accepted,model){
 const versions=prompts.map(prompt=>({type:'gap',prompt,answer,accepted:[answer,...accepted],definition:model,explain:model}));
 findTopic(topicId).questions.push({...versions[0],id:topicId+'-gap-'+id,versions});
}

/* Alternative scenarios share family IDs, so lesson coverage never grows. */
function moreVersions(topicId,rows){
 rows.forEach((v,i)=>addVersion(topicId+'-'+i,v));
}
function addVersion(id,[prompt,answer,a,b,c,explain]){
 const q=TOPICS.flatMap(t=>t.questions).find(q=>q.id===id);
 if(!q)throw Error('Unknown question family '+id);
 q.versions||=[{prompt:q.prompt,answer:q.answer,options:q.options,explain:q.explain}];
 q.versions.push({prompt,answer,options:[answer,a,b,c],explain});
}

function chooseQuestionVersion(skill){
 progress.variantBags||={};progress.variantLast||={};
 const key=skill.variantKey||skill.id;
 const last=progress.variantLast[key];let variant;
 if(skill.make){
  for(let attempt=0;attempt<32;attempt++){
   let seed=1+Math.floor(Math.random()*2147483646);
   variantRng=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
   try{variant=skill.make(seed);}finally{variantRng=null;}
   if(variant.prompt!==last)break;
  }
 }else if(skill.versions){
  let bag=progress.variantBags[key];
  if(!Array.isArray(bag)||!bag.length||bag.some(i=>!Number.isInteger(i)||!skill.versions[i])){
   bag=shuffle(skill.versions.map((_,i)=>i));
   if(bag.length>1&&skill.versions[bag[0]].prompt===last)[bag[0],bag[1]]=[bag[1],bag[0]];
   progress.variantBags[key]=bag;
  }
  variant=skill.versions[bag.shift()];
 }else variant=skill;
 progress.variantLast[key]=variant.prompt;return variant;
}

['Real sources',['Emf is energy supplied per coulomb by a source. Terminal p.d. is energy per coulomb available externally. Internal resistance dissipates energy and reduces terminal p.d. while supplying current.','Add internal and external resistance when finding circuit current. Multiply current by internal resistance for the internal voltage drop, or current squared by internal resistance for lost power.']],
['Potential dividers',['An unloaded divider gives the supply voltage multiplied by the output resistor’s fraction of total resistance. Equal resistors divide voltage equally.','If output is across the lower resistor, increasing that resistance raises output. An NTC thermistor there lowers output when warmed; an LDR raises output when darkened.']]
],
waves:[
['Wave quantities',['Wavelength is the shortest separation between points in phase. Wave speed is frequency multiplied by wavelength. Frequency stays fixed at a boundary, while speed and wavelength can change.','Refraction angles are measured from the normal. Refractive index compares light speed in vacuum with speed in the material.']],
['Superposition and stationary waves',['Coherent sources have equal frequency and constant phase difference. Whole-wavelength path differences give constructive interference; odd half-wavelength differences give destructive interference. Equal-amplitude antiphase waves cancel completely.','Convert a path difference to a fraction of wavelength and multiply by a full turn for phase difference. Nodes have zero displacement amplitude, antinodes maximum. Adjacent nodes are half a wavelength apart; a fixed-end string’s fundamental contains half a wavelength.']],
['Spreading, intensity and polarisation',['Diffraction is strongest when opening width is comparable with wavelength. A much wider opening gives less spreading. Intensity grows with amplitude squared.','Only transverse waves can be plane polarised. Light’s polarisation demonstrates transverse oscillations; longitudinal sound in air cannot be plane polarised.']],

['Optical calculations',['Double-slit fringe spacing grows with wavelength and screen distance, and falls as slit separation increases. Convert nanometres and millimetres consistently.','Use Snell’s law with angles from the normal. Total internal reflection requires travel from higher to lower refractive index and an incidence angle greater than the critical angle.']]
],
quantum:[
['Photons',['Photon energy increases with frequency and decreases with wavelength. Convert wavelength to metres before using SI constants.','An electronvolt is an energy: 1 eV = 1.60 × 10⁻¹⁹ J. Convert work functions from eV to joules when using Planck’s constant in SI units.']],
['Photoelectric emission',['The work function is minimum energy to remove an electron from a metal surface. At threshold frequency a photon has just enough energy, leaving zero maximum photoelectron kinetic energy.','Below threshold, increasing intensity or waiting longer does not cause emission in the single-photon model. Above threshold, higher frequency increases maximum photoelectron kinetic energy.','At fixed frequency, higher intensity brings more photons per second and can increase photoelectric current, but does not increase individual photon energy.']],
['Stopping and matter waves',['Stopping potential removes the fastest photoelectrons’ kinetic energy. Divide their energy in joules by electron charge magnitude for the stopping-potential magnitude.','De Broglie wavelength is inversely proportional to momentum. Doubling momentum halves wavelength; particles such as electrons can therefore show diffraction.']]
],
thermal:[
['Particles and energy',['Internal energy sums random microscopic kinetic and potential energies. It excludes the bulk kinetic energy of the whole moving object. A stationary solid still contains vibrating particles and intermolecular potential energy.','Temperature relates to mean random kinetic energy, not total energy. Specific heat capacity describes heating 1 kg by 1 K without a state change. Use the temperature rise: a Celsius interval equals a kelvin interval.']],
['Changes of state and work',['Specific latent heat is energy to change the state of 1 kg without changing temperature. Melting or boiling changes particle arrangement and potential energy rather than mean kinetic energy.','Internal-energy change is heating supplied plus work done on the system. Subtract work if the gas does it on its surroundings.']],
['Ideal gases',['Use absolute temperature in gas laws: kelvin is approximately Celsius plus 273. For a fixed amount of ideal gas, pressure multiplied by volume divided by absolute temperature is constant.','Ideal molecules have negligible volume and negligible interactions except during elastic collisions. Gas pressure comes from their rate of momentum transfer to walls. Heating at fixed volume increases collision rate and mean momentum change per collision.']],
['Moles and molecular speeds',['Multiply amount in moles by Avogadro’s constant to count molecules. Use the gas constant for molar calculations and Boltzmann’s constant for individual molecules.','R.m.s. speed is the square root of mean squared speed. For a fixed molecular mass it increases with the square root of absolute temperature. In the microscopic speed equation use the mass of one molecule, not the whole gas sample.']]
],
circular:[
['Changing direction',['In uniform circular motion, velocity is tangent to the circle while acceleration is towards the centre. Constant speed does not mean constant velocity.','The inward force does no work because it is perpendicular to instantaneous motion, so kinetic energy stays constant.']],
['Real forces and timing',['Centripetal force describes the inward resultant, not an extra interaction. Tension may supply it for a ball on a string and gravity for a circular orbit.','Required inward force grows with speed squared and falls as radius increases at fixed speed. One revolution is 2π radians; angular speed is this angle divided by period. Speed is circumference divided by period, or angular speed multiplied by radius.']]
],
oscillations:[
['Recognise SHM',['SHM acceleration is proportional to displacement from equilibrium and directed towards equilibrium. The negative sign in the relationship represents the restoring direction.','At equilibrium speed is maximum and acceleration zero. At extremes speed is zero and acceleration magnitude maximum. Energy swaps between kinetic and potential stores.']],
['Period and amplitude',['Period is reciprocal frequency; angular frequency is 2π divided by period. Maximum speed is angular frequency multiplied by amplitude.','A mass-spring period grows with the square root of mass and decreases with the square root of stiffness. For small-angle pendulums, period grows with the square root of length and decreases with the square root of gravitational acceleration.']],
['Damping and resonance',['Damping transfers mechanical energy away and reduces free-oscillation amplitude.','A driven oscillator responds strongly near its natural frequency. Greater damping makes the resonance peak lower and less sharp.']]
],
gravity:[
['Field and potential',['Gravitational field strength is force per unit mass. It points inward around an isolated spherical body and follows an inverse-square relationship with distance from its centre outside the body.','Potential is potential energy per unit mass. With zero at infinity, finite potentials are negative because energy must be supplied to move a mass out to infinity. Moving away increases potential towards zero.']],
['Orbits and escape',['Gravity supplies centripetal force in circular orbits. A larger radius around the same planet gives lower orbital speed. Measure radius from the centre, not height above the surface.','Escape speed provides enough kinetic energy to reach infinity with none left. It exceeds circular orbital speed at the same radius.','A geostationary orbit is circular, equatorial, in Earth’s rotation direction and has a one-sidereal-day period. It stays above one equatorial point; a polar orbit cannot do this.']]
],
astro:[
['Brightness and distance',['Luminosity is total radiated power; flux is received power per unit area. For unobscured isotropic radiation, flux falls with distance squared. A standard candle has known luminosity, enabling a distance estimate.','Annual parallax is apparent angular movement relative to distant stars as Earth orbits. Nearby stars have larger parallax. Distance in parsecs is reciprocal parallax in arcseconds.']],

['Stars and spectra',['For a spherical black body, luminosity grows with radius squared and absolute temperature to the fourth power. Wien’s law makes peak wavelength inversely proportional to temperature.','On a conventional H–R diagram, luminosity increases upwards and temperature decreases to the right. Cool luminous giants are upper right; hot faint white dwarfs lower left.','Sun-like stars leave white dwarfs. Sufficiently massive stars can undergo supernovae and leave neutron stars or black holes. Initial mass strongly affects the later evolution.']],
['Cosmology',['Redshift is wavelength increase divided by emitted wavelength; it is dimensionless. At low recession speeds it approximates speed divided by light speed. Hubble’s law links large-scale recession speed and distance.','The cosmic microwave background is widespread cooled radiation from the early hot universe, supporting the hot Big Bang model.']]
],
capacitors:[
['Storage',['Capacitance is charge stored per unit p.d., measured in farads. Convert microfarads to farads for SI calculations.','Stored energy depends on capacitance and voltage squared. Doubling voltage at fixed capacitance quadruples energy; doubling capacitance at fixed voltage doubles energy.']],
['Charging and discharge',['An initially uncharged capacitor connected through a resistor has maximum initial current. As capacitor p.d. rises, resistor p.d. and current fall.','Discharge charge, voltage and current magnitude decrease exponentially, transferring stored energy to thermal energy in the resistor. After one time constant about 37% remains and 63% has left; after two about 14% remains.']],
['Timing and combinations',['Time constant is resistance multiplied by capacitance. A graph of natural logarithm of discharge charge or voltage against time has gradient equal to the negative reciprocal of time constant.','Parallel capacitances add because they share p.d. and charges add. Series capacitors have equal charge magnitudes and their reciprocals of capacitance add. Two identical capacitors in series have half either capacitance.']]
],
electric:[
['Field direction and strength',['Field strength is force per unit small positive test charge. Positive charges feel force along the field; negative electrons feel force opposite to it.','Positive point charges have outward radial lines and negative charges inward lines. Between large parallel plates, away from edges, straight parallel equally spaced lines represent an approximately uniform field.']],
['Forces and motion',['Electric force depends on charge and field strength. For constant force, use mass to find acceleration, then constant-acceleration motion equations.','Coulomb force depends on the product of point-charge magnitudes and inversely on separation squared. Convert microcoulombs to coulombs. Energy gained through an accelerating p.d. depends on charge magnitude and voltage.']],
['Potential',['Potential is potential energy per unit charge relative to a reference. With zero at infinity, point-charge potential has the source charge’s sign: negative near a negative charge and positive near a positive charge.','An equipotential has unchanged potential along it, so moving a fixed charge along it changes no electric potential energy. Field lines point towards decreasing potential. Do not confuse potential with potential energy or field strength.']]
],
magnetic:[
['Forces and circular paths',['Magnetic force on a point charge requires motion perpendicular to the field. A stationary charge or parallel motion gives zero force; perpendicular motion gives the maximum for fixed speed.','The force is perpendicular to velocity, so it changes direction without changing kinetic energy. It can provide circular-motion centripetal force. A current-carrying wire’s force also depends on current, active length and angle.']],
['Flux and induction',['Flux takes account of field strength, area and orientation. Use the angle between field and the area normal, not the coil plane. Flux linkage multiplies single-turn flux by number of turns.','Induced emf magnitude is the rate of change of flux linkage. Lenz’s law makes the induced effect oppose its producing change, consistent with energy conservation.']],
['Applications',['An ideal transformer’s voltage ratio equals its turns ratio. Input power equals output power, so stepping voltage up steps current down.','Hall voltage develops as carriers deflect sideways and separate charge. Its transverse electric force eventually balances magnetic deflection.','A cyclotron accelerates particles across the gap between dees; the magnetic field inside bends their path. At fixed field, a faster non-relativistic particle follows a larger semicircle.']]
],
nuclear:[
['Decay and measurements',['Individual radioactive decays are unpredictable, but large samples follow statistical exponential decay. Half-life halves the number of undecayed nuclei or the activity. Each further half-life halves the remaining fraction again.','Activity is decay rate in becquerels. It depends on decay constant and undecayed population. Convert hours to seconds for a decay constant in reciprocal seconds; subtract background from measured count rates.']],
['Nuclear changes',['Alpha emission removes two protons and two neutrons: mass number falls by four and proton number by two. Alpha radiation is highly ionising but weakly penetrating and is stopped by paper.','In beta-minus decay a neutron becomes a proton, emitting an electron and electron antineutrino. Mass number stays fixed and proton number rises by one. Gamma radiation is uncharged electromagnetic radiation, more penetrating and less strongly ionising than alpha.']],
['Particles and binding',['Protons are uud and neutrons udd. Up quarks carry positive two-thirds of an elementary charge; down quarks negative one-third. Electrons, positrons and neutrinos are leptons, not combinations of quarks.','Mass defect corresponds to binding energy. Fusion of light nuclei or fission of heavy nuclei can release energy when products are more tightly bound per nucleon and have lower total rest energy.']]
],
medical:[
['Ultrasound',['Acoustic impedance is density multiplied by sound speed. Differences in impedance cause reflection at tissue boundaries. Gel removes an air gap that would otherwise strongly reflect ultrasound at the probe-skin interface.','Echo time includes outward and return journeys. Convert microseconds to seconds, multiply by sound speed, then halve the total distance for reflector depth.']],
['X-rays and CT',['X-ray attenuation is exponential. An attenuation coefficient describes reduction with thickness; identical layers each multiply intensity by the same transmission fraction.','A conventional radiograph superimposes structures along the beam path. CT uses projections from many directions to reconstruct cross-sectional slices.']],

['Tracers, PET and MRI',['A diagnostic tracer needs detectable emissions, suitable biological behaviour and a half-life long enough for measurements but short enough to limit unnecessary exposure afterwards.','PET detects paired photons from positron-electron annihilation, travelling in approximately opposite directions and arriving in coincidence.','MRI uses strong magnetic fields and radiofrequency excitation of nuclei. It does not use ionising X-rays or ultrasound echoes.']]
]
};
for(const t of TOPICS){
 const authored=LESSON_NOTES[t.id];if(!authored)continue;
 t.lessonSections=authored.map(([title,points])=>({title,points}));
 const definitions=t.questions.filter(q=>q.type==='definition').map(q=>{
  const term=q.versions[0].prompt.replace(/^Define /,'').replace(/\.$/,'');
  return term.charAt(0).toUpperCase()+term.slice(1)+': '+q.answer;
 });
 if(definitions.length)t.lessonSections.push({title:'Definitions to remember',points:definitions});
 const methods=[...new Set(t.questions.filter(q=>q.make).map(q=>q.learn).filter(Boolean))];
 if(methods.length)t.lessonSections.push({title:'Relationships & calculation reminders',points:methods});
 t.lesson=t.lessonSections.flatMap(section=>section.points);
}



/* Small synthesized earcons: no downloads, autoplay or external audio files. */
const Sound=(()=>{
 const volume=0.55;
 const key='physics-lab-audio-v1';
 let enabled=true,context=null,master=null,unavailable=false,resumePending=null,epoch=0;
 const voices=new Set();
 try{const value=JSON.parse(localStorage.getItem(key));if(typeof value==='boolean')enabled=value;}catch{}
 function ensure(){
  if(context&&context.state!=='closed')return context;
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio){unavailable=true;return null;}
  try{context=new Audio({latencyHint:'interactive'});master=context.createGain();master.gain.value=enabled?volume:0;master.connect(context.destination);return context;}catch{unavailable=true;return null;}
 }
 function unlock(){
  if(!enabled)return;
  const ctx=ensure();if(!ctx)return;
  if(ctx.state==='suspended'){try{if(!resumePending)resumePending=Promise.resolve(ctx.resume()).then(()=>{resumePending=null;}).catch(()=>{resumePending=null;});return resumePending;}catch{}}
  return null;
 }
 function tone(ctx,frequency,offset,duration,volume=0.14,type='sine',endFrequency=frequency){
  const osc=ctx.createOscillator(),gain=ctx.createGain(),start=ctx.currentTime+0.008+offset;
  osc.type=type;osc.frequency.setValueAtTime(frequency,start);
  if(endFrequency!==frequency)osc.frequency.exponentialRampToValueAtTime(endFrequency,start+duration*0.72);
  gain.gain.setValueAtTime(0,start);
  gain.gain.linearRampToValueAtTime(volume,start+0.003);
  gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
  osc.connect(gain);gain.connect(master);voices.add(osc);
  osc.onended=()=>{voices.delete(osc);osc.disconnect();gain.disconnect();};
  osc.start(start);osc.stop(start+duration+0.012);
 }
 function play(kind,level=0){
  if(!enabled)return false;
  const ctx=ensure();if(!ctx)return false;
  // A user gesture unlocks the context; a blocked browser stays silent.
  const requestedEpoch=epoch,pending=unlock();
  if(ctx.state!=='running'){
   if(pending)pending.then(()=>{if(enabled&&epoch===requestedEpoch&&context===ctx&&ctx.state==='running')play(kind,level);}).catch(()=>{});
   return false;
  }
  try{
   if(kind==='correct'){
    // Two rounded, downward-swept bubbles: short bodies, no bell overtones.
    tone(ctx,620,0.018,0.080,0.17,'sine',370);
    tone(ctx,860,0.066,0.105,0.115,'sine',510);
   }else if(kind==='incorrect'){
    tone(ctx,230,0.025,0.085,0.085,'sine',165);
   }else if(kind==='finish'){
    tone(ctx,420,0.015,0.075,0.105,'sine',285);
    tone(ctx,560,0.070,0.080,0.10,'sine',365);
    tone(ctx,720,0.125,0.115,0.115,'sine',465);
   }else if(kind==='fruit-drop'){
    // A compact low thup with a soft, quickly falling top.
    tone(ctx,240,0,0.075,0.12,'sine',82);
    tone(ctx,470,0,0.025,0.035,'sine',190);
   }else if(kind==='fruit-merge'||kind==='fruit-big-merge'){
    const size=Math.max(0,Math.min(11,Number(level)||0));
    const pitch=420+size*32;
    tone(ctx,pitch,0,0.10,0.15,'sine',pitch*.48);
    tone(ctx,pitch*1.36,0.035,0.10,0.085,'sine',pitch*.72);
    if(kind==='fruit-big-merge')tone(ctx,160,0.012,0.14,0.13,'sine',65);
   }else if(kind==='tap'||kind==='start'){
    // A soft dry tick rather than a pitched UI beep.
    tone(ctx,440,0,0.026,0.065,'sine',190);   }else return false;
   return true;
  }catch{return false;}
 }
 function speaker(){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/>'+(enabled?'<path d="M16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14"/>':'<path d="m17 9 5 6m0-6-5 6"/>')+'</svg>';
 }
 function markup(){
  return '<button type="button" class="sound-toggle" data-sound-toggle aria-pressed="'+enabled+'" aria-label="'+(enabled?'Mute revision sounds':'Enable revision sounds')+'" title="'+(enabled?'Mute sounds':'Enable sounds')+'">'+speaker()+'<span>Sound '+(enabled?'on':'off')+'</span></button>';
 }
 function refresh(){
  document.querySelectorAll?.('[data-sound-toggle]').forEach(button=>{
   button.setAttribute('aria-pressed',String(enabled));
   button.setAttribute('aria-label',unavailable?'Sound is unavailable in this browser':enabled?'Mute revision sounds':'Enable revision sounds');
   button.title=unavailable?'Sound unavailable':enabled?'Mute sounds':'Enable sounds';
   button.innerHTML=speaker()+'<span>Sound '+(enabled?'on':'off')+'</span>';
  });
 }
 function toggle(){
  enabled=!enabled;epoch++;
  try{localStorage.setItem(key,JSON.stringify(enabled));}catch{}
  if(!enabled&&context){
   const now=context.currentTime;
   try{master.gain.cancelScheduledValues(now);master.gain.setTargetAtTime(0,now,0.004);}catch{}
   for(const voice of voices){try{voice.stop(now+0.012);}catch{}}
  }else if(enabled){
   unlock();
   if(master&&context){master.gain.cancelScheduledValues(context.currentTime);master.gain.setValueAtTime(volume,context.currentTime);}
   play('tap');
  }
  refresh();return enabled;
 }
 document.addEventListener('pointerdown',unlock,{passive:true});
 document.addEventListener('keydown',unlock,{passive:true});
 // Capture before navigation can replace the clicked button. Native keyboard
 // activation also produces a click, so every enabled button gets one tap.
 document.addEventListener('click',event=>{
  const button=event.target.closest?.('button');
  if(!button||button.disabled||button.getAttribute?.('aria-disabled')==='true')return;
  if(button.hasAttribute('data-sound-toggle')){toggle();return;}
  play('tap');
 },true);
 return {play,unlock,toggle,markup,isEnabled:()=>enabled};
})();


function isTyped(q){return q.type==='definition'||q.type==='gap';}
function questionsFor(t,kind=mode){
 const mcq=t.questions.filter(q=>!isTyped(q));
 if(kind==='suika'||(kind==='rush'&&rushVariant==='suika'))return mcq;
 if(kind==='rush')return mcq.flatMap(q=>{const versions=(q.versions||[q]).filter(v=>v.retrieval);return versions.length?[{...q,versions,variantKey:q.id+'-retrieval',make:undefined,retrieval:true}]:[];});
 const written=t.questions.filter(isTyped),mixed=[];
 mcq.forEach((q,i)=>{mixed.push(q);if((i+1)%3===0&&written.length)mixed.push(written.shift());});
 return mixed.concat(written);
}
function normaliseAnswer(value){return String(value).normalize('NFKC').toLowerCase().replace(/[’']/g,'').replace(/(\d)([a-z])/g,'$1 $2').replace(/[^a-z0-9%]+/g,' ').replace(/\s+/g,' ').trim();}
function oneTypo(a,b){
 if(a===b)return true;
 if(a.length<6||b.length<6||a.includes(' ')||b.includes(' ')||Math.abs(a.length-b.length)>1)return false;
 if(a.length===b.length){const wrong=[];for(let i=0;i<a.length;i++)if(a[i]!==b[i])wrong.push(i);return wrong.length===1||(wrong.length===2&&wrong[1]===wrong[0]+1&&a[wrong[0]]===b[wrong[1]]&&a[wrong[1]]===b[wrong[0]]);}
 if(a.length>b.length)[a,b]=[b,a];
 let i=0,j=0,skipped=false;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;}else{if(skipped)return false;skipped=true;j++;}}return true;
}
function gradeTyped(q,response){
 const text=normaliseAnswer(response);
 if(q.type==='gap'){const accepted=(q.accepted||[q.answer]).map(normaliseAnswer);return {correct:accepted.some(a=>oneTypo(text,a)),matches:[],negated:false};}
 const matches=q.keyPoints.map(p=>p.patterns.some(pattern=>new RegExp(pattern,'i').test(text)));
 const negated=/\b(?:not|never|no)\s+(?:(?:the|a|an)\s+)?(?:rate|sum|total|force|energy|charge|magnitude|direction|proportional|flow|per)\b/.test(text);
 return {correct:matches.every(Boolean)&&!negated,matches,negated};
}
function renderResponse(q){
 if(!isTyped(q))return '<div class="choices">'+q.options.map((opt,i)=>'<button class="choice '+(session.answered?(opt===q.answer?'right':opt===session.choice?'wrong':''):'')+'" data-answer="'+i+'" '+(session.answered?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+opt+'</span>'+(session.answered&&opt===q.answer?'<span style="margin-left:auto">✓</span>':'')+'</button>').join('')+'</div>';
 const value=session.answered?session.choice:(session.typedDraft||'');
 const label=q.type==='gap'?'Type the missing word or phrase':'Write the definition in your own words';
 const field=q.type==='gap'?'<input id="typed-answer" class="typed-input" type="text" maxlength="120" autocomplete="off" spellcheck="true" value="'+escapeHTML(value)+'" '+(session.answered?'readonly':'')+'>':'<textarea id="typed-answer" class="typed-input definition-input" maxlength="1500" spellcheck="true" '+(session.answered?'readonly':'')+'>'+escapeHTML(value)+'</textarea>';
 return '<form id="typed-form" novalidate><div class="answer-type">'+(q.type==='gap'?'FILL THE GAP':'DEFINITION RECALL')+'</div><label class="typed-label" for="typed-answer">'+label+'</label>'+field+'<p class="typed-error" id="typed-error" role="status"></p><div class="typed-controls"><span class="hint">'+(q.type==='gap'?'Press Enter to check':'Key-idea wording check · Ctrl/⌘ + Enter to check')+'</span><button class="btn" type="submit" '+(session.answered?'hidden':'')+'>Check answer →</button></div></form>';
}
function checkTyped(provided){
 if(!session||view!=='session'||session.phase==='lesson'||session.answered||session.kind==='rush')return false;
 const q=currentQuestion();if(!isTyped(q))return false;
 const response=String(typeof provided==='string'?provided:($('#typed-answer')?.value||'')).trim().slice(0,q.type==='gap'?120:1500);
 if(!response){const error=$('#typed-error');if(error)error.textContent='Type an answer before checking.';$('#typed-answer')?.setAttribute('aria-invalid','true');return false;}
 const grade=gradeTyped(q,response),previous=progress.answers[q.id]||{};
 session.choice=response;session.typedDraft=response;session.answered=true;session.reviewOpen=false;
 session.results.push({...q,choice:response,correct:grade.correct,matches:grade.matches,negated:grade.negated,previousCorrect:!!previous.correct,reviewed:false});
 progress.attempts++;if(grade.correct)progress.correct++;
 progress.answers[q.id]={correct:!!(previous.correct||grade.correct),lastCorrect:grade.correct,attempts:(previous.attempts||0)+1};
 persist();Sound.play(grade.correct?'correct':'incorrect');updateTypedDisplay();return true;
}
function typedFeedback(q){
 const r=session.results[session.results.length-1];if(!r||r.id!==q.id)return '';
 let html='<div class="feedback '+(r.correct?'':'wrong')+'" role="status"><strong>'+(r.correct?(q.type==='gap'?'✓ That’s right.':'✓ Key ideas found.'):(q.type==='gap'?'Check the missing word.':'Check these key ideas.'))+'</strong>';
 if(q.type==='gap')return html+'<p>Answer: <b>'+escapeHTML(q.answer)+'</b></p><p style="margin-top:8px">'+escapeHTML(q.explain)+'</p></div>';
 html+='<div class="model-definition"><span>MODEL DEFINITION</span><p>'+escapeHTML(q.answer)+'</p></div>';
 if(r.negated&&!r.reviewed)html+='<p class="hint">Your wording appears to negate an essential idea. Compare it with the model definition.</p>';
 html+='<ul class="definition-points">'+q.keyPoints.map((p,i)=>'<li class="'+(r.matches[i]?'matched':'missing')+'"><span aria-hidden="true">'+(r.matches[i]?'✓':'○')+'</span>'+escapeHTML(p.text)+'</li>').join('')+'</ul>';
 if(session.reviewOpen){html+='<div class="typed-review"><b>Review equivalent wording</b><p class="hint">Tick only the ideas your original answer included. This adjusts this attempt without adding another one.</p>'+q.keyPoints.map((p,i)=>'<label class="mark-point"><input type="checkbox" data-typed-point="'+i+'" '+(r.matches[i]?'checked':'')+'><span>'+escapeHTML(p.text)+'</span></label>').join('')+'<button class="btn light" type="button" id="save-typed-review">Save reviewed result</button></div>';}
 else html+='<button class="btn ghost" type="button" id="review-typed">'+(r.reviewed?'Review your wording again':'Equivalent wording? Review the key ideas')+'</button>';
 return html+'</div>';
}
function saveTypedReview(provided){
 if(!session||!session.answered||session.kind==='rush'||!isTyped(currentQuestion()))return;
 const q=currentQuestion(),r=session.results.at(-1);if(q.type!=='definition'||r.id!==q.id)return;
 const flags=Array.isArray(provided)?provided:Array.from(document.querySelectorAll('[data-typed-point]')).map(el=>el.checked);
 if(flags.length!==q.keyPoints.length)return;
 const correct=flags.every(Boolean);if(correct&&!r.correct)Sound.play('correct');progress.correct+=Number(correct)-Number(r.correct);
 r.correct=correct;r.matches=flags;r.reviewed=true;session.reviewOpen=false;
 const previous=progress.answers[q.id];previous.correct=!!(r.previousCorrect||correct);previous.lastCorrect=correct;
 persist();updateTypedDisplay();
}
function updateTypedDisplay(){
 const form=$('#typed-form');if(!form?.isConnected){questionView();return;}
 const q=currentQuestion(),r=session.results.at(-1),input=$('#typed-answer');
 input.readOnly=true;input.removeAttribute('aria-invalid');input.classList.toggle('accepted',r.correct);input.classList.toggle('needs-review',!r.correct);
