function filtered(){return TOPICS.filter(t=>(moduleFilter==='all'||t.module===Number(moduleFilter))&&`${t.title} ${t.code}`.toLowerCase().includes(query.toLowerCase()));}
function topicRows(){let ts=filtered();return ts.length?MODULES.filter(m=>ts.some(t=>t.module===m.id)).map(m=>`<h2 class="module-heading">${COURSE.group} ${m.id} <span style="padding:0 5px">/</span> ${m.full}</h2><div class="topic-list">${ts.filter(t=>t.module===m.id).map(t=>`<label class="topic-row"><input type="checkbox" data-topic="${t.id}" ${selected.has(t.id)?'checked':''}><div><h3>${t.title}</h3><p>${t.code} · ${mode==='exam'?`${totalMarks(t)} marks · original exam-style set`:`${questionsFor(t).length} questions · ${mode==='rush'?(rushVariant==='normal'?'knowledge only':'knowledge + calculations'):'choice + typed recall'}`}</p></div><span class="topic-percent">${mode==='exam'?(progress.exams[t.id]?.submitted?'✓':''):percentage(t)?percentage(t)+'%':''}</span></label>`).join('')}</div>`).join(''):'<div class="empty">No topics match your search. Try a different word or module.</div>';}
function selectionText(){let n=selected.size,count=TOPICS.filter(t=>selected.has(t.id)).reduce((sum,t)=>sum+questionsFor(t).length,0);return `<div><p><strong>${n} topic${n===1?'':'s'} selected</strong></p><small>${mode==='exam'?`${n} practice set${n===1?'':'s'}`:`${count} questions in your ${mode==='rush'?'rush pool':'learning session'}`}</small></div><button class="btn ${mode==='rush'?'orange':''}" id="start" ${!n?'disabled':''}>${mode==='rush'?(rushVariant==='suika'?'Start Suika mode':'Start the rush'):mode==='exam'?'Start practice':'Start learning'} <span>→</span></button>`;}
function setup(){const words={learn:['LEARN & QUIZ','Understand it. Then answer it.','Pick your topics for bite-sized lessons and questions with instant explanations.'],exam:['EXAM PRACTICE','Turn knowledge into marks.','Work through original multi-part questions, then self-mark with worked solutions.'],rush:['QUESTION RUSH','Quick thinking. Stronger recall.','Normal Rush tests knowledge without calculator work. Suika keeps the full multiple-choice bank, including calculations.']};shell(`${intro(...words[mode])}${mode==='rush'?rushControls():mode==='exam'?'<div class="settings"><span class="icon">'+icon('exam')+'</span><span>Write your answers first. Reveal the mark scheme when ready, then check the marks you earned.</span></div>':''}<div class="topic-tools"><input class="search" id="search" placeholder="Search topics or specification codes" aria-label="Search topics" value="${escapeHTML(query)}"><select id="module-filter" aria-label="Filter module"><option value="all">All modules</option>${MODULES.map(m=>`<option value="${m.id}" ${String(moduleFilter)===String(m.id)?'selected':''}>${COURSE.group} ${m.id} · ${m.title}</option>`).join('')}</select><button class="btn light" id="select-visible">Select shown</button><button class="btn light" id="clear-selection">Clear</button></div><div id="topic-rows">${topicRows()}</div><div class="selection-bar" id="selection-bar">${selectionText()}</div>`);}
function updateSelection(){const el=$('#selection-bar');if(el)el.innerHTML=selectionText();}
function stopTimers(){clearInterval(ticker);clearTimeout(autoNext);ticker=autoNext=null;Suika.stop();}
function navigate(dest){stopTimers();session=null;query='';moduleFilter='all';if(['learn','rush','exam'].includes(dest)){mode=dest;view='setup';}else view=dest;render();window.scrollTo(0,0);}
function render(){if(view==='home')homeScreen();else if(view==='dashboard')dashboard();else if(view==='setup')setup();else if(view==='progress')showProgress();else if(view==='session')session.kind==='suika'?Suika.render():session.kind==='exam'?examView():questionView();else if(view==='summary')summaryView();}
function versionFor(skill,topicId){
  progress.variantTurns ||= {};
  const turn=progress.variantTurns[skill.id]||0;
  const variant=chooseQuestionVersion(skill);
  progress.variantTurns[skill.id]=turn+1;
  const prepared={id:skill.id,topic:topicId,prompt:variant.prompt,...variant,options:variant.options?shuffle(variant.options):undefined,learn:skill.learn||''};return mode==='rush'?rushQuestion(prepared):prepared;
}
function begin(){if(!selected.size)return;if(mode==='rush'&&rushVariant==='suika'){Suika.start(TOPICS.filter(t=>selected.has(t.id)));return;}stopTimers();const ts=TOPICS.filter(t=>selected.has(t.id));progress.lastTopic=ts[0].id;view='session';if(mode==='exam'){session={kind:'exam',topics:ts.map(t=>t.id),index:0};examView();}else{let queue=ts.flatMap(t=>questionsFor(t).map(q=>versionFor(q,t.id)));if(mode==='rush')queue=shuffle(queue);session={kind:mode,queue,index:0,results:[],phase:mode==='learn'?'lesson':'question',seen:[],answered:false,choice:null,ends:Date.now()+duration*1000,seconds:duration};persist();questionView();if(mode==='rush')ticker=setInterval(tick,200);}persist();window.scrollTo(0,0);}
function currentQuestion(){return session.queue[session.index];}
function lessonView(t){
 const notes=t.lessonSections?t.lessonSections.map(section=>'<section class="lesson-section"><h3>'+escapeHTML(section.title)+'</h3><ul>'+section.points.map(point=>'<li>'+escapeHTML(point)+'</li>').join('')+'</ul></section>').join(''):t.lesson.map(p=>'<p>'+p+'</p>').join('');
 return '<article class="panel lesson"><div class="lesson-label">First, the idea · '+t.code+'</div><h2>'+t.title+'</h2><div class="lesson-notes">'+notes+'</div><div class="session-bottom"><span>Read at your own pace. You can revisit these notes during the quiz.</span><button class="btn" id="lesson-done">Try the questions →</button></div></article>';
}
function questionView(){if(session?.kind==='suika'){Suika.render();return;}const q=currentQuestion(),t=TOPICS.find(t=>t.id===q.topic);progress.lastTopic=t.id;persist();const isRush=session.kind==='rush';const done=session.results.length;let content=`<div class="session"><button class="back" data-nav="${isRush?'rush':'learn'}">← End session and choose topics</button><div class="session-head"><span>${isRush?'QUESTION RUSH':`LEARN & QUIZ · ${t.title}`}</span>${isRush?`<span class="timer" id="timer">${formatTime(Math.max(0,Math.ceil((session.ends-Date.now())/1000)))}</span>`:`<span>Question ${session.index+1} of ${session.queue.length}</span>`}</div><div class="track"><i style="width:${isRush?Math.max(0,100*(session.ends-Date.now())/(duration*1000)):100*done/session.queue.length}%" id="session-track"></i></div>`;
if(session.phase==='lesson')content+=lessonView(t);else{content+=`<article class="panel"><span class="badge">${t.code} · ${t.title}</span>${isRush?`<span class="marks" id="rush-score">${session.results.filter(r=>r.correct).length} correct</span>`:''}${!isRush&&q.learn?`<div class="learning-cue"><strong>Remember the idea</strong>${q.learn}</div>`:''}<h2 class="question">${q.prompt}</h2>${isRush?rushEquations(q):''}${renderResponse(q)}<div id="feedback-slot" aria-live="polite">${session.answered?feedback(q):''}</div><div class="session-bottom" id="question-actions">${!isRush?'<button class="btn ghost" id="show-lesson">Revisit the idea</button>':'<span class="shortcuts">Use keys 1–4 to answer</span>'}${session.answered?`<button class="btn" id="next" ${session.kind==='rush'?'disabled':''}>${session.index===session.queue.length-1?'See results':'Next question'} →</button>`:`<span class="hint">${isRush?'Choose quickly. Every correct answer counts.':isTyped(q)?'Check your wording when you are ready.':'Choose an answer to check your understanding.'}</span>`}</div></article>`;}
content+=`<div class="session-bottom"><span id="session-count">${session.results.filter(r=>r.correct).length} correct · ${session.results.length} answered</span><button class="btn light" id="finish-early">Finish session</button></div></div>`;shell(content);}
function feedback(q){if(isTyped(q))return typedFeedback(q);let right=session.choice===q.answer;return `<div class="feedback ${right?'':'wrong'}" role="status"><strong>${right?'✓ That’s right.':'Let’s make this one stick.'}</strong>${right?'':`<p style="margin-bottom:8px">Correct answer: <b>${q.answer}</b></p>`}${session.kind==='rush'?rushExplanation(q):escapeHTML(q.explain)}${session.kind==='rush'?'<p class="hint" style="margin-top:9px">'+(right?'Moving on automatically.':'Next question in <span id="rush-cooldown">'+Math.max(0,Math.ceil((session.advanceAt-Date.now())/1000))+'</span> seconds.')+'</p>':''}</div>`;}
function answer(index){if(session?.kind==='suika'){Suika.answer(index);return;}if(!session||session.answered||view!=='session'||session.phase==='lesson')return;if(session.kind==='rush'&&Date.now()>=session.ends){finish();return;}let q=currentQuestion();if(isTyped(q))return;let choice=q.options[index];if(choice===undefined)return;let right=choice===q.answer;session.choice=choice;session.answered=true;session.results.push({id:q.id,topic:q.topic,prompt:q.prompt,answer:q.answer,choice,correct:right,explain:q.explain,options:[...q.options],learn:q.learn||''});progress.attempts++;if(right)progress.correct++;const previous=progress.answers[q.id]||{};progress.answers[q.id]={correct:!!(previous.correct||right),lastCorrect:right,attempts:(previous.attempts||0)+1};if(session.kind==='rush')session.advanceAt=Date.now()+(right?700:3000);persist();Sound.play(right?'correct':'incorrect');revealAnswer();if(session.kind==='rush')autoNext=setTimeout(nextQuestion,right?700:3000);}
function revealAnswer(){
  const choices=$('.choices');
  if(!choices?.isConnected){questionView();return;}
  const q=currentQuestion();
  choices.querySelectorAll('button').forEach((button,i)=>{
    button.disabled=true;button.classList.toggle('right',q.options[i]===q.answer);
    button.classList.toggle('wrong',q.options[i]===session.choice&&session.choice!==q.answer);
  });
  $('#feedback-slot').innerHTML=feedback(q);
  $('#question-actions').innerHTML=(session.kind==='rush'?'<span class="shortcuts">Use keys 1–4 to answer</span>':'<button class="btn ghost" id="show-lesson">Revisit the idea</button>')+
    '<button class="btn" id="next" '+(session.kind==='rush'?'disabled':'')+'>'+(session.index===session.queue.length-1?'See results':'Next question')+' →</button>';
  const correct=session.results.filter(r=>r.correct).length;
  $('#session-count').textContent=correct+' correct · '+session.results.length+' answered';
  if($('#rush-score'))$('#rush-score').textContent=correct+' correct';
}
function nextQuestion(){if(session?.kind==='suika'){Suika.next();return;}if(session?.kind==='rush'&&session.answered&&Date.now()<(session.advanceAt||0))return;clearTimeout(autoNext);if(!session||view!=='session'||!session.answered)return;if(session.kind==='rush'&&Date.now()>=session.ends){finish();return;}session.index++;if(session.index>=session.queue.length){finish();return;}const t=currentQuestion().topic;session.phase=session.kind==='learn'&&!session.seen.includes(t)?'lesson':'question';session.answered=false;session.choice=null;session.typedDraft='';session.reviewOpen=false;questionView();window.scrollTo(0,0);}
function tick(){if(!session||session.kind!=='rush'||view!=='session')return;const cooldown=$('#rush-cooldown');if(cooldown)cooldown.textContent=Math.max(0,Math.ceil(((session.advanceAt||0)-Date.now())/1000));let seconds=Math.max(0,Math.ceil((session.ends-Date.now())/1000));let timer=$('#timer');if(timer){timer.textContent=formatTime(seconds);timer.classList.toggle('low',seconds<=15);}let track=$('#session-track');if(track)track.style.width=Math.max(0,100*(session.ends-Date.now())/(duration*1000))+'%';if(seconds<=0)finish();}
function formatTime(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function finish(){if(!session||view==='summary')return;if(session.kind==='suika'){session.game=Suika.snapshot();progress.suikaBest=Math.max(progress.suikaBest||0,session.game?.score||0);}stopTimers();if((session.kind==='exam'||session.results.length)&&!(session.kind==='suika'&&session.game?.over))Sound.play('finish');if(session.kind!=='exam'){progress.sessions++;let correct=session.results.filter(r=>r.correct).length;if(session.kind==='rush')progress.rushBest=Math.max(progress.rushBest,correct);persist();}view='summary';summaryView();window.scrollTo(0,0);}
function summaryView(){if(session.kind==='suika'){Suika.summary();return;}if(session.kind==='exam'){const ts=session.topics.map(id=>TOPICS.find(t=>t.id===id)),earned=ts.reduce((s,t)=>s+examMarks(t),0),total=ts.reduce((s,t)=>s+totalMarks(t),0),marked=ts.filter(t=>progress.exams[t.id]?.submitted).length;shell(`<div class="session"><article class="panel summary"><div class="eyebrow">EXAM PRACTICE</div><h1>A step closer to exam day.</h1><div class="score">${earned}<span style="font-size:25px;color:var(--muted)"> / ${total}</span></div><p>Self-assessed marks · ${marked} of ${ts.length} sets marked</p><button class="btn" data-nav="exam">Choose more practice →</button></article>${ts.map(t=>`<article class="panel"><h3>${t.title}</h3><p class="hint">${progress.exams[t.id]?.submitted?`${examMarks(t)} / ${totalMarks(t)} marks self-awarded`:'Draft saved · not marked yet'}</p><button class="btn ghost" data-exam-revisit="${t.id}">Revisit this set →</button></article>`).join('')}</div>`);return;}
const right=session.results.filter(r=>r.correct).length,wrong=session.results.filter(r=>!r.correct),n=session.results.length;shell(`<div class="session"><article class="panel summary"><div class="eyebrow">${session.kind==='rush'?'RUSH COMPLETE':'LEARNING SESSION COMPLETE'}</div><h1>${n?'That’s progress. Keep it going.':'Ready when you are.'}</h1><div class="score">${right}<span style="font-size:25px;color:var(--muted)"> / ${n}</span></div><p>${n?`${Math.round(100*right/n)}% accuracy this session`:'No answers submitted yet'}${session.kind==='rush'?` · Best rush: ${progress.rushBest} correct`:''}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${wrong.length?'<button class="btn" id="retry-missed">Retry missed questions →</button>':''}<button class="btn light" data-nav="${session.kind==='rush'?'rush':'learn'}">Choose topics</button><button class="btn light" data-nav="exam">Try exam practice</button></div></article>${wrong.length?`<article class="panel"><h2>Make these ones stick</h2><p class="hint" style="margin:8px 0 18px">A mistake is a useful place to learn. Here’s what to take away.</p>${wrong.map(r=>`<div class="review-item"><b>${r.prompt}</b><p>Your answer: ${escapeHTML(r.choice)}</p><p style="color:var(--green)">Correct: ${r.answer}</p><p>${session.kind==='rush'?rushExplanation(r):r.explain}</p></div>`).join('')}</article>`:n?'<article class="panel"><h3>All answers correct. Nice work.</h3><p class="hint" style="margin-top:8px">Try an exam set to practise explaining and applying these ideas.</p></article>':''}</div>`);}
function retryMissed(){const queue=session.results.filter(r=>!r.correct).map(r=>({...r,options:r.options?shuffle(r.options):undefined}));session={kind:'learn',queue,index:0,results:[],phase:'question',seen:[],answered:false,choice:null};view='session';questionView();window.scrollTo(0,0);}
function examState(id){if(!progress.exams[id])progress.exams[id]={drafts:{},marks:{},revealed:false,submitted:false};return progress.exams[id];}
function examView(){let t=TOPICS.find(t=>t.id===session.topics[session.index]),ex=examState(t.id);shell(`<div class="session"><button class="back" data-nav="exam">← Back to exam topics · drafts save automatically</button><div class="session-head"><span>EXAM PRACTICE · SET ${session.index+1} OF ${session.topics.length}</span><span>${totalMarks(t)} marks</span></div><div class="track"><i style="width:${100*(session.index+1)/session.topics.length}%"></i></div><article class="panel"><span class="badge">${t.code} · Original exam-style question</span><h1 style="font-size:27px;margin:6px 0 18px">${t.title}</h1><p style="font-size:14px">${t.exam.context}</p>${t.exam.parts.map((p,i)=>`<section class="exam-part"><h3><span class="marks">[${p[1].length}]</span><b>(${String.fromCharCode(97+i)})</b> ${p[0]}</h3><label class="sr-only" for="draft-${i}">Your answer to part ${String.fromCharCode(97+i)}</label><textarea id="draft-${i}" data-draft="${i}" placeholder="Write your answer and working here…">${escapeHTML(ex.drafts[i]||'')}</textarea>${ex.revealed?`<div class="scheme"><h4 style="font-size:13px">Mark scheme · ${p[1].length} marks</h4><p>Check each point your answer earns. Each point is worth one mark.</p>${p[1].map((point,j)=>`<label class="mark-point"><input type="checkbox" data-mark="${i}-${j}" ${ex.marks[`${i}-${j}`]?'checked':''}><span>${point}</span></label>`).join('')}<div class="exam-worked"><b>Why this works</b><br>${p[2]}</div></div>`:''}</section>`).join('')}<div class="session-bottom"><span id="exam-score">${ex.revealed?`${examMarks(t)} / ${totalMarks(t)} marks self-awarded`:'Answer first, then compare with the worked solution.'}</span>${!ex.revealed?'<button class="btn" id="reveal-scheme">Reveal mark scheme →</button>':'<button class="btn" id="save-marks">Save marks & continue →</button>'}</div></article><div class="session-bottom">${session.index>0?'<button class="btn light" id="previous-exam">← Previous set</button>':'<span class="hint">Your work is saved on this device.</span>'}<button class="btn light" id="finish-early">Finish practice</button></div></div>`);}
function showProgress(){shell(`${intro('YOUR REVISION JOURNEY','See how far you’ve come.','A clear picture of your practice. Progress is saved in this browser on this device.')}<div class="stats"><div class="stat"><div><b>${overall()} / ${skillTotal()}</b><span>Question types practised successfully</span></div></div><div class="stat"><div><b>${progress.attempts}</b><span>Total quiz attempts</span></div></div><div class="stat"><div><b>${progress.rushBest}</b><span>Best rush · correct answers in one session</span></div></div></div><article class="panel"><div class="section-title"><h2>Topic by topic</h2><small>Coverage follows skills across their variants, not an exam-grade prediction</small></div><div style="overflow-x:auto"><table class="progress-table"><thead><tr><th>Topic</th><th>Quiz coverage</th><th>Latest recall</th><th>Exam marks</th></tr></thead><tbody>${TOPICS.map(t=>{const attempted=t.questions.filter(q=>progress.answers[q.id]);let latest=attempted.filter(q=>progress.answers[q.id].lastCorrect).length;return `<tr><td><button class="btn ghost" style="font-size:12px;text-align:left" data-quick="${t.id}">${t.code} ${t.title}</button></td><td>${completed(t)} / ${t.questions.length}<div class="track" style="width:75px;margin:6px 0"><i style="width:${percentage(t)}%"></i></div></td><td>${attempted.length?`${latest} / ${attempted.length}`:'Not tried'}</td><td>${progress.exams[t.id]?.submitted?`${examMarks(t)} / ${totalMarks(t)}`:progress.exams[t.id]?'Draft':'Not tried'}</td></tr>`;}).join('')}</tbody></table></div></article><div class="settings"><span>Saved locally: quiz history, exam drafts and self-assessed marks. Clearing browser data removes this progress.</span><button class="btn light" id="reset-progress">Reset progress</button></div>`);}
function toast(text){$('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=text;d.setAttribute('role','status');document.body.append(d);setTimeout(()=>d.remove(),2400);}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){navigate(b.dataset.nav);return;}if(b.dataset.quick){selected=new Set([b.dataset.quick]);mode='learn';begin();return;}if(b.dataset.module){selected=new Set(TOPICS.filter(t=>t.module===Number(b.dataset.module)).map(t=>t.id));mode='learn';view='setup';moduleFilter=b.dataset.module;query='';stopTimers();session=null;setup();window.scrollTo(0,0);return;}if(b.dataset.answer!==undefined){answer(Number(b.dataset.answer));return;}if(b.dataset.examRevisit){selected=new Set([b.dataset.examRevisit]);mode='exam';begin();return;}
switch(b.id){case 'start':begin();break;case 'clear-selection':selected.clear();setup();break;case 'select-visible':filtered().forEach(t=>selected.add(t.id));setup();break;case 'lesson-done':session.phase='question';if(!session.seen.includes(currentQuestion().topic))session.seen.push(currentQuestion().topic);questionView();break;case 'show-lesson':session.phase='lesson';questionView();break;case 'next':nextQuestion();break;case 'finish-early':finish();break;case 'retry-missed':retryMissed();break;case 'reveal-scheme':examState(session.topics[session.index]).revealed=true;persist();examView();break;case 'save-marks':examState(session.topics[session.index]).submitted=true;persist();if(session.index===session.topics.length-1)finish();else{session.index++;examView();window.scrollTo(0,0);}break;case 'previous-exam':session.index--;examView();window.scrollTo(0,0);break;case 'reset-progress':if(confirm('Reset all quiz progress, exam drafts and marks on this device?')){progress=fresh();persist();showProgress();toast('Progress reset');}break;}});
document.addEventListener('change',e=>{let el=e.target;if(el.dataset.topic){el.checked?selected.add(el.dataset.topic):selected.delete(el.dataset.topic);updateSelection();}if(el.id==='module-filter'){moduleFilter=el.value;$('#topic-rows').innerHTML=topicRows();}if(el.id==='duration')duration=Number(el.value);if(el.dataset.mark){let t=TOPICS.find(t=>t.id===session.topics[session.index]);examState(t.id).marks[el.dataset.mark]=el.checked;persist();$('#exam-score').textContent=`${examMarks(t)} / ${totalMarks(t)} marks self-awarded`;}});
document.addEventListener('input',e=>{let el=e.target;if(el.id==='search'){query=el.value;$('#topic-rows').innerHTML=topicRows();}if(el.dataset.draft!==undefined){examState(session.topics[session.index]).drafts[el.dataset.draft]=el.value;persist();}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(view==='session'&&session?.kind==='suika'){if(/^[1-4]$/.test(e.key)){e.preventDefault();Suika.answer(Number(e.key)-1);}return;}if(view==='session'&&session?.kind!=='exam'&&session.phase!=='lesson'){if(/^[1-4]$/.test(e.key)){e.preventDefault();answer(Number(e.key)-1);}else if(e.key==='Enter'&&session.answered){e.preventDefault();nextQuestion();}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
render();
</script></body></html>
